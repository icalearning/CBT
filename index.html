G[10]={o:["Describe MBCT, ACT, DBT and metacognitive therapy and how each differs from traditional CBT","Use basic mindfulness, acceptance and defusion ideas appropriately and within your training","Explain emotion regulation skills and the limits of using them without full DBT training","Apply culturally responsive CBT to immigration, refugee, resettlement and family-expectation contexts"],
L:[
{t:"11.1 Mindfulness-based cognitive therapy and mindfulness",
p:["Mindfulness means paying attention to present experience, on purpose and without judgment. Mindfulness-based stress reduction was developed by Kabat-Zinn (1990), and mindfulness-based cognitive therapy (MBCT) combined mindfulness practice with cognitive therapy ideas to reduce relapse in people with recurrent depression (Segal et al., 2013). MBCT is typically an eight-week group programme. Its key skill is decentering: noticing thoughts as mental events that come and go, not as facts. An individual patient data meta-analysis found that MBCT reduced the risk of depressive relapse compared with usual care, and had comparable effects to antidepressant medication (Kuyken et al., 2016).",
"The difference from traditional CBT is one of emphasis. Traditional CBT examines the content of a thought and tests it. MBCT changes the relationship to thoughts and moods and the habit of rumination, and does not evaluate content. Mindfulness is not risk-free for everyone: some people, including some with trauma histories, may find silence or inward attention distressing (Lindahl et al., 2017). Offer choices, such as eyes open and attention to an external anchor, and check in about reactions. Teaching a full MBCT programme requires specific training."],
cs:"Teaching example (fictional). Helen, 49, has had three episodes of depression and is well now. She joins an MBCT group. In week three she notices a ruminative loop (“I’m going to relapse”) and labels it “a thought about relapse,” then returns her attention to her breath and a planned walk.",
ex:"Practise a three-minute mindful breathing exercise. Note what you noticed, and one way you might adapt the exercise for a client who finds it distressing.",
q:{q:"What is decentering in MBCT?",o:["Avoiding all thoughts","Noticing thoughts as mental events rather than facts","Arguing with thoughts","Ignoring emotions"],a:1,e:"Decentering changes the relationship to thoughts (Segal et al., 2013); it does not test their content as traditional CBT does."}},
{t:"11.2 Acceptance and commitment therapy, defusion and acceptance",
p:["Acceptance and commitment therapy (ACT) aims at psychological flexibility: contacting the present moment and acting in line with values even when difficult thoughts and feelings are present (Hayes et al., 2012). Its six processes are acceptance, cognitive defusion, present-moment awareness, self-as-context, values and committed action. Defusion techniques loosen the grip of thoughts, for example by adding the phrase “I’m having the thought that…” in front of a thought. Acceptance means making room for unwanted experiences instead of struggling with them, and it is not the same as resignation.",
"ACT differs from traditional CBT because the target is not reducing or changing thought content but changing how one relates to it and what one does. Many clinicians combine ideas from both approaches. A meta-analysis found ACT to be more effective than control conditions and comparable to established treatments for several conditions, though the evidence varies in quality (A-Tjak et al., 2015). Values work can be especially meaningful with newcomers, whose values around family, faith and contribution may be central. Formal ACT training is recommended."],
cs:"Teaching example (fictional). Amara (Module 3) is stuck in the thought “I’m not good enough for this country.” Her therapist introduces defusion.",
dlg:[["Therapist","When the thought ‘I’m not good enough’ shows up, what do you usually do?"],["Client","I argue with it, or I stay in bed."],["Therapist","How well does that work?"],["Client","Not well. It comes back stronger."],["Therapist","Let’s try something different. Say it as ‘I’m having the thought that I’m not good enough.’ What do you notice?"],["Client","It feels a bit lighter. Like it’s a thought and not the truth."],["Therapist","What matters to you that you’d like to move toward, even with that thought around?"],["Client","Being a good nurse. Helping patients."]],
why:"Clinical reasoning: the therapist first explores the cost of the usual strategies (control agenda), then offers defusion as an experiment, not a rule. Linking to values moves the focus from fighting the thought to committed action. The client’s own words guide the next step.",
ex:"Choose a recurring thought. Add “I’m having the thought that…” and note any change. Then write one value and one small action that fits it.",
q:{q:"How does ACT differ from traditional CBT?",o:["It tests thoughts with evidence","It targets the relationship to thoughts and values-based action more than the content of thoughts","It is only behavioural","It ignores values"],a:1,e:"ACT aims at psychological flexibility through acceptance, defusion and committed action (Hayes et al., 2012)."}},
{t:"11.3 Dialectical behaviour therapy, emotion regulation and metacognitive therapy",
p:["Dialectical behaviour therapy (DBT) was developed to treat chronic suicidality and emotion dysregulation, particularly in borderline personality disorder. It balances acceptance and change (the dialectic). Standard DBT combines individual therapy, a skills group, phone coaching and a therapist consultation team. Skills fall into four areas: mindfulness, distress tolerance, emotion regulation and interpersonal effectiveness (Linehan, 2015). Individual skills may be taught to many clients, but full DBT requires specialized training and a team. Clients at high risk need appropriate services.",
"Metacognitive therapy (MCT), developed by Wells, focuses on beliefs about thinking, such as “worry is uncontrollable” or “rumination helps me solve problems,” and on a pattern of worry, rumination and threat monitoring called the cognitive attentional syndrome. It uses techniques such as detached mindfulness and attention training instead of examining the content of thoughts (Wells, 2009). Its evidence base is developing and clinicians should present it accordingly. The table at the end of this module summarizes how these approaches differ from traditional CBT."],
cs:"Teaching example (fictional). Leila (Module 3) learns a distress tolerance skill from her therapist to use when she feels flooded after contact with her landlord. Her therapist is not DBT-trained and so presents it as a single coping skill, not as a DBT programme, and consults her supervisor.",
ex:"Pick one emotion regulation skill (for example, naming the emotion and checking the facts). Use it once this week and describe the situation, how you applied it, and the result.",
q:{q:"What is a limit when using DBT skills without DBT training?",o:["There is none","Skills may be taught individually, but full DBT requires specialized training and a team","They are harmful","They only apply to adolescents"],a:1,e:"Skills can be taught as coping tools, but standard DBT is a multi-component programme (Linehan, 2015)."}},
{t:"11.4 Culturally responsive CBT: immigration, resettlement and identity",
p:["Culturally responsive practice starts from the premise that culture shapes how distress is understood, expressed and addressed, and that it also shapes the therapist. Useful elements include asking about the client’s own explanation of the problem, idioms of distress (such as body symptoms or spiritual explanations), expectations of the therapist, family and community roles, language, religion and spirituality, and experiences of discrimination (Hays & Iwamasa, 2006; Hays, 2016). Meta-analytic evidence suggests that culturally adapted interventions can be beneficial, though effects vary and adaptation quality matters (Hall et al., 2016). Do not treat culture as a checklist or assume a client fits a group stereotype.",
"For immigrants and refugees, mental health is shaped by pre-migration experiences, the journey, and post-migration stressors such as insecure status, unemployment, discrimination, language barriers and separation from family (Kirmayer et al., 2011; Silove et al., 2017). Distress may reflect real stress, not disorder, and practical support (settlement, legal, housing, employment services) is part of care. Use qualified interpreters, not family members, where possible, and plan time for interpreted sessions. Family expectations and collective values may be sources of strength as well as pressure. Cultural identity change, such as differences between generations, can be explored through values and collaborative problem-solving. Use trauma-informed pacing, and consult your supervisor on complex cases."],
cs:"Teaching example (fictional). Rahim, 34, a refugee, has poor sleep and fears, and his family expects him to support relatives overseas. Priya, 26, feels torn between her parents’ wishes about marriage and her own plans. Wei, 40, is an engineer working in a survival job and feels ashamed. Each therapist explores meaning, values and practical needs before technique.",
dlg:[["Therapist","You’ve told me a lot about your family’s expectations. How do you understand what’s been hardest?"],["Client","I want to respect my parents, but I also want to choose my own path."],["Therapist","Both matter to you. What does respecting your parents mean in your family?"],["Client","Listening, being present, not shaming them."],["Therapist","Are there ways to honour that and still make your own choices?"],["Client","Maybe telling them early and explaining my reasons, not just announcing."],["Therapist","Would you like to plan and rehearse that conversation together?"]],
why:"Clinical reasoning: the therapist avoids imposing individual autonomy as the goal, asks what respect means in this family, and looks for a path that fits the client’s values. The final offer to rehearse turns the insight into action, using behavioural rehearsal from Module 7.",
ex:"Write five culturally sensitive questions you could ask a newcomer client about their understanding of distress, family expectations and what help they would find acceptable.",
q:{q:"Which approach is most culturally responsive for family expectations?",o:["Telling the client to prioritize independence","Exploring what the values mean in the client’s family and finding options that fit the client’s own goals","Avoiding the topic","Assuming all families are alike"],a:1,e:"Responsive practice explores meaning and values and avoids imposing the therapist’s cultural assumptions (Hays & Iwamasa, 2006)."}}],
x:'<div class="card"><h3>Table: third-wave approaches compared with traditional CBT</h3><div class="tw"><table><tr><th>Approach</th><th>Main focus</th><th>Core methods</th><th>Difference from traditional CBT</th><th>Training</th></tr><tr><td>Traditional CBT</td><td>Content of thoughts and behaviours</td><td>Thought records, experiments, exposure</td><td>Tests and changes thought content</td><td>CBT training</td></tr><tr><td>MBCT</td><td>Relapse prevention in recurrent depression</td><td>Mindfulness, decentering</td><td>Changes relationship to thoughts</td><td>Specific MBCT training</td></tr><tr><td>ACT</td><td>Psychological flexibility</td><td>Defusion, acceptance, values</td><td>Not aimed at changing thought content</td><td>ACT training</td></tr><tr><td>DBT</td><td>Emotion dysregulation, chronic suicidality</td><td>Skills groups, individual therapy, coaching</td><td>Balances acceptance and change</td><td>Full DBT team training</td></tr><tr><td>MCT</td><td>Beliefs about thinking</td><td>Detached mindfulness, attention training</td><td>Targets thinking processes, not content</td><td>MCT training</td></tr></table></div></div>',
s:["Third-wave approaches share features with CBT but differ in what they target.","MBCT and ACT change the relationship to thoughts; DBT balances acceptance and change; MCT targets beliefs about thinking.","Full programmes require training; skills should be presented honestly.","Culturally responsive CBT explores meaning, values and practical needs, and avoids stereotypes."],
r:["segal","kab","kuy","lind","hayes","atjak","lin","wells","hays","hays16","hall","kirm","silove"]};

G[11]={o:["Use measures and clinical judgment to evaluate progress and outcome","Help clients consolidate skills and recognize early warning signs","Plan booster sessions and a collaborative, well-prepared ending","Apply ethical and boundary principles to CBT practice in Ontario","Write a complete relapse prevention plan with a client"],
L:[
{t:"12.1 Progress monitoring and outcome evaluation",
p:["Evaluation should run through the whole treatment, not just at the end. Brief measures completed at intervals (for example the PHQ-9 and GAD-7, Module 5) show whether a client is improving and prompt a change of plan if not. Measurement-based care, which uses routine measures to inform decisions, is promoted in behavioural health, although implementation takes effort and the evidence is still being refined (Lewis et al., 2019). Share scores with the client, ask what they mean to them, and combine them with goal ratings and the client’s own account.",
"Interpreting change needs care. Statistical approaches such as reliable change and clinically significant change distinguish real improvement from measurement noise (Jacobson & Truax, 1991). For the PHQ-9, a change of about five points has been described as clinically meaningful (Löwe et al., 2004). Scores can be misleading when a client minimizes symptoms or when language and cultural factors affect how items are understood. If there is no progress after an adequate trial, review the formulation, the alliance, homework, practical barriers and the need for a different or additional treatment, and consult your supervisor."],
cs:"Teaching example (fictional). Elena’s PHQ-9 fell from 17 to 9 over twelve sessions, while her sleep log and job-search goals improved. Her therapist reviews the scores with her, asks what has changed in daily life, and notes that two items on worry remain high, which becomes a focus for the final sessions.",
ex:"Describe how you would explain a fall in a questionnaire score to a client and what you would do if the score did not change after six sessions.",
q:{q:"Which is the best use of outcome measures?",o:["Replace clinical judgment","Track progress with the client, interpret alongside their account, and adjust the plan","Use only at the end","Use to diagnose"],a:1,e:"Measures support decisions with clinical judgment and the client’s view (Lewis et al., 2019; Jacobson & Truax, 1991)."}},
{t:"12.2 Consolidating skills and recognizing early warning signs",
p:["Late in treatment the aim is for the client to become their own therapist (Beck, 2021). Review what has worked, which skills the client uses independently, and which situations remain difficult. A written “therapy blueprint” or notebook summarizing the formulation, key skills and examples of progress helps clients to retain learning. Encourage self-led practice between sessions, and in the final sessions let the client take the lead in planning and in running part of the session.",
"Early warning signs are the person-specific changes that tend to precede a setback: sleeping less, avoiding people, rumination returning, skipping routines, increased alcohol use, or a return of familiar thoughts such as “I’m not good enough.” Identify them from the formulation and from the client’s history of earlier episodes. Distinguish a lapse (a temporary slip) from a relapse (a return to the earlier pattern). Treating a lapse as proof of failure can itself drive relapse, which is why planning for it matters (Marlatt & Gordon, 1985)."],
cs:"Teaching example (fictional). Dev lists his own warning signs: avoiding emails, rehearsing sentences before meetings, and the thought “everyone will notice.” He and his therapist agree that any two of these for a week means using the plan and booking a check-in.",
ex:"List five early warning signs you would look for in a fictional client, in their thoughts, feelings, behaviours and body. For each, write one first response.",
q:{q:"What is the difference between a lapse and a relapse?",o:["There is none","A lapse is a temporary slip; a relapse is a return to the earlier pattern","A lapse is always worse","Both mean failure"],a:1,e:"Viewing a lapse as a normal, manageable event reduces the chance that it becomes a relapse (Marlatt & Gordon, 1985)."}},
{t:"12.3 Booster sessions and relapse-prevention evidence",
p:["Booster sessions are scheduled follow-up appointments after the main treatment, often at increasing intervals, used to review progress, practise skills and respond early to difficulties. There is evidence that the benefits of cognitive therapy for depression can be more enduring than those of medication after discontinuation (Hollon et al., 2005), but this finding comes from specific trials and should not be overstated. Decisions about medication belong to the client and prescriber.",
"Plan boosters collaboratively, in line with the client’s needs, resources and service limits, and make sure the client knows how to get help sooner if signs of relapse appear. Some people benefit from a short “tune-up” series. In publicly funded programs, the available number of sessions may be limited, so discuss this at the start and plan accordingly. Clients also need to know where to turn between sessions: their doctor, a community service, and for crisis support 9-8-8 or 911 (Public Health Agency of Canada, 2023)."],
cs:"Teaching example (fictional). Elena agrees to booster sessions at one, three and six months, with a note that she can book sooner if two warning signs persist for a week.",
ex:"Outline a booster-session plan for a fictional client: timing, what you will review, and what the client will bring.",
q:{q:"What is the purpose of booster sessions?",o:["To restart therapy from the beginning","To review progress, practise skills and respond early to difficulties","To increase fees","To replace relapse plans"],a:1,e:"Boosters support maintenance and early response (Beck, 2021)."}},
{t:"12.4 Termination",
p:["Ending therapy begins early: discuss the expected length at the start, review progress regularly, and begin tapering the frequency as goals are met. Prepare the client for the end by reviewing what they have learned, what they did that produced change (so they credit themselves, not only the therapist), and what challenges they expect. Mixed feelings about ending, including anxiety or sadness, are common and can be discussed. Where goals are not reached, discuss options such as referral, a different treatment or a pause.",
"Ethically, avoid abrupt abandonment. If you must end because of a change in your own situation, give notice and arrange continuity of care (CRPO, n.d.; OCSWSSW, 2023). Document the ending, including the plan and any referrals. Sensitivity to cultural context applies: some clients may wish to offer a small gift or a meal as thanks, and your response should follow your organization’s policy while respecting the meaning of the gesture."],
cs:"Teaching example (fictional). Elena’s final session.",
dlg:[["Therapist","We have our last planned session today. How are you feeling about ending?"],["Client","Nervous, but proud. I’m afraid I’ll slip back."],["Therapist","That’s understandable. What did you do that helped you most?"],["Client","Keeping the sleep schedule, calling my sister, and the thought records when I panic."],["Therapist","Those were your actions. What will you do if the old thoughts return?"],["Client","Write them down, check the evidence, and book a booster if it lasts a week."],["Therapist","That’s a solid plan. Let’s put it in writing together."]],
why:"Clinical reasoning: the therapist names the client’s feelings, asks what produced change so that she credits herself, and has her restate the plan in her own words, which tests readiness. The final step moves into a written relapse prevention plan.",
ex:"Write three questions you would ask in a final session to help a client consolidate learning and prepare for setbacks.",
q:{q:"Which is an ethical practice at the end of therapy?",o:["Ending abruptly without notice","Preparing the client, planning follow-up and documenting the ending","Avoiding discussion of feelings","Refusing all referrals"],a:1,e:"Planned endings and continuity of care are expected (CRPO, n.d.; OCSWSSW, 2023)."}},
{t:"12.5 Ethics, professional boundaries and a complete relapse prevention plan",
p:["Ethical CBT practice rests on informed consent, competence, confidentiality, respect for client autonomy and avoidance of harm. Boundaries protect clients because of the power imbalance in therapy. Avoid dual relationships and conflicts of interest, take care with social media and electronic contact, keep self-disclosure purposeful, and never exploit a client financially, emotionally or sexually; boundary violations are serious professional misconduct (CRPO, n.d.; OCSWSSW, 2023). Where boundaries are uncertain, consult your supervisor and document your reasoning. Attend to your own wellbeing and keep up supervision and continuing education. Registered professionals in Ontario should practise within the scope and standards of their own college.",
"A complete relapse prevention plan is written with the client and kept somewhere accessible. It includes: high-risk situations; early warning signs (thoughts, feelings, behaviours, body); skills that have worked; a step-by-step action plan; supports and contacts; a plan for lapses; when and how to get further help; and a date to review the plan. Elena’s plan appears in Worksheet 14. Real plans should use the client’s language, be short enough to use and be revised after each booster."],
cs:"Teaching example (fictional). A former client sends a friend request to the therapist. The therapist declines politely, explains the reason in the next contact, documents the exchange and, where needed, consults her supervisor.",
ex:"Complete Worksheet 14 for a fictional client. Check that every section is specific, in the client’s own words, and has a first step they could take today.",
q:{q:"A former client sends a social media request. What is the best response?",o:["Accept to build rapport","Maintain boundaries, respond according to policy and consult supervision if unsure","Ignore all contact","Share personal details"],a:1,e:"Boundaries protect clients; policy and consultation guide decisions (CRPO, n.d.; OCSWSSW, 2023)."}}],
x:'<div class="card"><h3>Worksheet 14: Relapse prevention plan</h3><p><b>Instructions.</b> Complete with your therapist near the end of treatment, using your own words. Keep a copy where you can find it quickly, and review it after each booster session. This plan supports your care and does not replace professional help or crisis services.</p><div class="tw"><table><tr><th>Section</th><th>Example (Elena, fictional)</th><th>Your plan</th></tr><tr><td>High-risk situations</td><td>Long gaps in work; money worries; poor sleep</td><td style="height:44px"></td></tr><tr><td>Early warning signs</td><td>Thought: I’m falling behind. Behaviour: late-night job searching, avoiding friends. Body: tired, tense.</td><td></td></tr><tr><td>Skills that worked</td><td>Sleep routine; thought record; activity schedule; calling my sister</td><td></td></tr><tr><td>Action plan</td><td>1) Stop job search at 9 pm. 2) Complete a thought record. 3) Plan two activities this week. 4) Call my sister.</td><td></td></tr><tr><td>If a lapse happens</td><td>A bad week is not failure. Return to the plan the next day.</td><td></td></tr><tr><td>Supports and contacts</td><td>Sister; family doctor; community centre</td><td></td></tr><tr><td>When to get help</td><td>Two warning signs for a week: book a booster. Thoughts of ending my life: call or text 9-8-8, or 911 in an emergency.</td><td></td></tr><tr><td>Review date</td><td>At each booster session</td><td></td></tr></table></div></div>',
s:["Evaluate progress throughout treatment using measures, goals and the client’s account.","Consolidate skills so that the client can be their own therapist.","Early warning signs and a plan for lapses reduce the risk of relapse.","Plan endings and boosters collaboratively and ethically.","Boundaries and competence protect clients; supervision supports good judgment."],

["Beck’s early clinical observations led him to propose that depression involves…",["Inward-turned hostility","Systematic negative biases about the self, the world and the future","Purely faulty reinforcement","A lack of any cognitive component"],1,"Beck (1963, 1976) described negative cognitive biases, later formalized as the cognitive triad."],
["A client says, “I feel like a failure.” In the five-part model this is best classified as…",["An emotion","A behaviour","A thought (self-judgment)","A physical reaction"],2,"The sentence is a judgment about the self; the emotion might be sadness or shame."],
["“My manager didn’t smile, so I’m going to be fired.” Which distortions are most apparent?",["Mind reading and fortune telling","Labelling only","Should statements","Mental filter only"],0,"The client assumes the manager’s thoughts and predicts an outcome without evidence."],
["Which is an intermediate belief (assumption)?",["“I’ll fail this test.”","“If I make a mistake, people will reject me.”","“I am unlovable.”","“My hands are shaking.”"],1,"An if–then rule is an intermediate belief; the first is an automatic thought and the third a core belief."],
["A client mentions hopelessness and sometimes thinking of ending their life. The best response is to…",["Continue the thought record and ignore it","Ask directly about suicidal thoughts, assess plan and means, follow protocol, and share 9-8-8","Tell them to think positively","Move straight to exposure"],1,"Direct questions are appropriate; safety comes before technique, with supervision and crisis resources."],
["Which is a maintaining factor in a formulation?",["A childhood where achievement earned approval","Avoiding friends after criticism, which increases isolation and low mood","Strong family support","Good language skills"],1,"Maintaining factors are current patterns that keep the problem going."],

["A client with depression stays in bed most days. The best first behavioural step is…",["A demanding daily schedule","A small, specific, graded activity linked to their values","Waiting until motivation returns","A long exposure task"],1,"Behavioural activation starts with small, graded, values-linked steps."],
["Which prediction is best for a behavioural experiment?",["“Things will go badly.”","“If I ask one question in the meeting, at least two colleagues will roll their eyes (70%).”","“I am a failure.”","“Nothing helps.”"],1,"Good predictions are specific, observable and rated."],
["During an exposure, a client grips the rail throughout. The therapist should…",["Ignore it","Name it as a safety behaviour and plan a step without it, with the client’s agreement","Stop all exposure","Add more reassurance"],1,"Safety behaviours can block learning and are addressed collaboratively."],
["A generalist therapist begins PTSD treatment and finds dissociation and heavy drinking. The best step is to…",["Start prolonged exposure immediately","Consult the supervisor, focus on stabilization and safety, and refer for specialized care","Stop all contact","Increase session length"],1,"Trauma-focused work needs specialized training; risk and stability come first."],
["A client has not completed homework. The most helpful response is to…",["Criticize their effort","Explore barriers without blame and adjust the task","Assign more","Stop assigning homework"],1,"Missed tasks are information."],
["How does ACT differ from traditional CBT?",["It tests thought content with evidence","It focuses on the relationship to thoughts and values-based action more than on changing content","It has no behavioural component","It is only for children"],1,"ACT aims at psychological flexibility."],
