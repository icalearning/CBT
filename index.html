R.pers="Persons, J. B. (2008). The case formulation approach to cognitive-behavior therapy. Guilford Press.";
R.kroenke="Kroenke, K., Spitzer, R. L., & Williams, J. B. W. (2001). The PHQ-9: Validity of a brief depression severity measure. Journal of General Internal Medicine, 16(9), 606–613.";
R.spitzer="Spitzer, R. L., Kroenke, K., Williams, J. B. W., & Löwe, B. (2006). A brief measure for assessing generalized anxiety disorder: The GAD-7. Archives of Internal Medicine, 166(10), 1092–1097.";
R.doran="Doran, G. T. (1981). There’s a S.M.A.R.T. way to write management’s goals and objectives. Management Review, 70(11), 35–36.";
R.stanley="Stanley, B., & Brown, G. K. (2012). Safety planning intervention: A brief intervention to mitigate suicide risk. Cognitive and Behavioral Practice, 19(2), 256–264.";

G[5]={o:["Explain cognitive restructuring and guided discovery","Use Socratic questions to examine evidence and generate alternative explanations","Apply decatastrophizing, the double-standard technique and perspective-taking","Use the downward-arrow technique to reach underlying meanings and beliefs","Help a client build a balanced thought they find believable"],
L:[
{t:"6.1 Guided discovery and Socratic questioning",
p:["Cognitive restructuring is the set of methods for examining thoughts and developing more accurate, useful alternatives (Beck, 2021; Rector, 2010). Its core method is guided discovery: the therapist asks questions that help the client notice information they have overlooked and reach their own conclusions. Padesky (1993) argued that the purpose of Socratic questioning is guiding discovery, not changing minds. Clark and Egan (2015) reviewed the method and noted that its definition and evidence base still need more research, so teach it as a skill to refine, not a settled formula.",
"A helpful sequence has four parts: ask informational questions to understand the thought, listen and reflect, summarize what was said, and ask a synthesizing or analytical question that links the pieces (Padesky, 1993). Common errors include asking leading questions that hide an argument, firing questions without reflecting, and using questions as a way of winning. A good test is whether you are curious about the answer. Cultural expectations also matter: a client who expects an expert to advise may find repeated questions confusing, so explain the purpose and balance questions with reflections."],
cs:"Teaching example (fictional). Dev, 40, thinks, “My presentation will be a disaster.” The therapist wants to explore this without arguing, and begins with questions about what Dev expects will happen.",
dlg:[["Therapist","When you say disaster, what exactly do you picture happening?"],["Client","I’ll lose my words and everyone will stare."],["Therapist","Has that happened before?"],["Client","Once, years ago. Most times I’ve been fine, honestly."],["Therapist","So we have one occasion where you lost your words, and several where you were fine. What do you make of that?"],["Client","I guess I focus on the one time."]],
why:"Clinical reasoning: the first question makes “disaster” concrete. The therapist asks for past data without disputing the thought, summarizes both sides, and asks an open synthesizing question. Dev reaches the observation about selective attention himself, which is more persuasive than being told.",
ex:"Take a thought from your own log and write four Socratic questions: two informational and two synthesizing. Mark any that might be leading.",
q:{q:"What is the main purpose of Socratic questioning?",o:["To prove the client wrong","To guide the client to discover information and reach their own conclusions","To avoid emotions","To give advice in question form"],a:1,e:"Padesky (1993) described its purpose as guiding discovery, not changing minds; leading questions defeat that purpose."}},
{t:"6.2 Evidence examination and alternative explanations",
p:["Examining evidence is the most widely used restructuring step. Ask what supports the thought and what does not, whether there are facts, not just feelings, and how another person would judge the same evidence. Record both columns in writing. Rate belief before and after to see whether it shifts (Greenberger & Padesky, 2016; Beck, 2021). The aim is a fair appraisal. If the evidence supports the thought, say so and move to problem-solving.",
"Generating alternative explanations follows naturally: What else could explain what happened? Ask for as many as the client can produce, including unlikely ones, then rate how likely each is. A client who thinks, “My manager didn’t greet me, so she’s angry,” may list busyness, a private worry, or a different schedule. The task is not to replace the original with a “positive” version, but to show that more than one reading is possible. Remember that some clients face real discrimination, and a thought that sounds distorted may be accurate. Evidence examination should never be used to talk someone out of what they have actually experienced."],
cs:"Teaching example (fictional). Priya (from Module 1) thinks, “My manager is angry with me.” She lists evidence for (no greeting) and against (she approved my last report; she asked me to join a project). She then writes four other explanations and rates the original at 35%, down from 85%.",
ex:"For one thought, make a two-column evidence table and write three alternative explanations. Rate your belief in the thought before and after.",
q:{q:"A client’s evidence supports their thought that a coworker is discriminating against them. What is the best step?",o:["Insist the thought is a distortion","Acknowledge the evidence and shift to problem-solving and support","Ask them to ignore it","Move to relaxation"],a:1,e:"When the thought is accurate, restructuring is not the right tool; problem-solving and advocacy are (Beck, 2021)."}},
{t:"6.3 Decatastrophizing, double-standard and perspective-taking",
p:["Decatastrophizing addresses predictions of disaster. A common sequence asks: What is the worst that could happen? How likely is it? What is the best that could happen? What is the most realistic outcome? If the worst happened, how would I cope, and who or what could help? (Beck, 2021). It differs from reassurance: the client does the thinking. Calculating a realistic probability is often less useful than building a coping plan.",
"The double-standard technique asks, “What would you say to a friend in the same situation?” (Burns, 1980). Many clients are harsh on themselves but kind to others, and the contrast is instructive. Perspective-taking invites the client to view a situation through others’ eyes, or from a future vantage point (“How will this look in a year?”). Cultural fit matters: some clients may prefer to consider what a respected elder or community member would say. Use these techniques only after the client feels heard, since they can sound dismissive if rushed."],
cs:"Teaching example (fictional). Noura, 44, fears that failing a licensing exam would “ruin my life.” With her therapist she explores worst, best and most likely outcomes, then builds a coping plan including retake dates, a study group and her family’s support.",
dlg:[["Therapist","If you did not pass, what is the worst that could happen?"],["Client","I’d have wasted everything, and I’d never work as a nurse here."],["Therapist","How likely does that feel, and how much would it matter if you could retake the exam?"],["Client","I could retake it in three months. So not ‘never.’"],["Therapist","If a friend were in your position, what would you tell her?"],["Client","That it’s a setback, not the end, and to get help studying."]],
why:"Clinical reasoning: the therapist uses the worst-case question to surface the fear, then asks about concrete alternatives. The double-standard question follows once the client has begun to look beyond the catastrophe. Noura generates the conclusion herself, and the next step is a coping plan.",
ex:"Pick a feared outcome. Answer the five decatastrophizing questions in writing, then write what you would say to a friend in the same position.",
q:{q:"Why can decatastrophizing include building a coping plan?",o:["Because the worst case is always likely","Because fear often rests on the belief that one could not cope, and a plan tests that belief","Because it replaces thinking","Because therapists should reassure"],a:1,e:"Examining coping resources addresses the belief that the outcome would be unmanageable (Beck, 2021)."}},
{t:"6.4 The downward-arrow technique",
p:["The downward arrow technique reveals the meaning beneath a thought by asking repeatedly, “If that were true, what would it mean?” or “What would be so bad about that?” (Burns, 1980; Beck, 2021). It usually moves from an automatic thought through consequences to an underlying assumption or core belief, such as “I’m a failure.” Stop when the client reaches a statement that feels emotionally significant and does not lead to anything further.",
"Use it with care. Because it can bring a client face to face with painful beliefs, it needs a secure alliance, a pace the client controls, and a plan for the next step: treat the result as a hypothesis and examine it, not as the final truth. Do not use it as a routine technique with clients who are in acute distress, and seek supervision when working with trauma-related beliefs. Record the chain in writing so that the client can see the steps are connected."],
cs:"Teaching example (fictional). Marco, 35, is anxious about a presentation. The downward arrow finds the chain shown in the example column of Worksheet 5 at the end of this module, which leads to his belief “I’m not good enough.”",
ex:"Complete a downward-arrow chain for one worry using Worksheet 5. Then write one question you could use to begin examining the final belief.",
q:{q:"What is the downward arrow used for?",o:["Reassuring the client","Uncovering underlying meanings and beliefs beneath a thought","Ending sessions","Prescribing homework"],a:1,e:"It traces a thought to its personal meaning, often an assumption or core belief (Burns, 1980; Beck, 2021)."}},
{t:"6.5 Balanced thinking: extended dialogue",
p:["Balanced thinking is the outcome of restructuring: a thought that takes account of all the evidence and that the client finds believable. A useful balanced thought is not purely positive. “I’m going to ace it” is as unsupported as “I’ll fail.” Instead, aim for something like “I may feel nervous, but I have prepared and handled similar talks.” After forming it, re-rate belief in the original thought and the emotion, and note what changed (Greenberger & Padesky, 2016).",
"If the balanced thought has little effect, the problem is often that it remains intellectual (“I know it, but I don’t feel it”). Options include examining the thought again for emotional hot spots, testing it with a behavioural experiment (Module 7), or exploring a deeper belief. Beck (2021) emphasizes that restructuring is a skill the client practises, not one that therapy performs for them. Extended practice with fictional dialogues is a good way to learn the pacing."],
cs:"Teaching example (fictional). Dev (from 6.1) continues exploring his presentation fear and writes a balanced thought.",
dlg:[["Therapist","Let’s put what we’ve found together. What would you say now about the presentation?"],["Client","That I might lose my words, but it’s happened once in many talks and I’ve recovered."],["Therapist","How much do you believe that, and how anxious do you feel now?"],["Client","I believe it about 65%. Anxiety went from 80 to 50."],["Therapist","A real shift. What might make it more believable?"],["Client","Trying it out. Maybe a short talk to my team first."],["Therapist","That could become an experiment. Shall we plan it next?"]],
why:"Clinical reasoning: asking the client to synthesize makes the balanced thought his. Re-rating shows measurable change without claiming a cure, and the question about believability leads naturally to a behavioural experiment, linking cognitive and behavioural work.",
ex:"Write a balanced thought for a worry of your own. Check that it is believable and not merely positive, then re-rate belief and emotion.",
q:{q:"Which is the best balanced thought?",o:["“I’ll definitely be perfect.”","“I may feel nervous, but I have prepared and handled similar situations.”","“Nothing bad can happen.”","“I should stop worrying.”"],a:1,e:"A balanced thought reflects the evidence and is believable; overly positive statements are as unsupported as catastrophic ones."}}],
x:'<div class="card"><h3>Worksheet 5: Downward-arrow questioning</h3><p><b>Instructions.</b> Write the first thought, then ask, “If that were true, what would it mean?” and write the answer. Repeat until you reach a statement that feels deeply personal. Rate belief (0–100) in the final belief, and review it with your supervisor or therapist.</p><div class="tw"><table><tr><th>Step</th><th>Example (Marco, fictional)</th><th>Your entry</th></tr><tr><td>Thought</td><td>I’ll stumble in my presentation</td><td style="height:44px"></td></tr><tr><td>If true, what would it mean?</td><td>They’ll think I’m incompetent</td><td></td></tr><tr><td>If true, what would it mean?</td><td>I could lose my job</td><td></td></tr><tr><td>If true, what would it mean?</td><td>I’m a failure</td><td></td></tr><tr><td>Underlying belief (0–100)</td><td>I’m not good enough (75)</td><td></td></tr></table></div></div>',
s:["Guided discovery helps clients reach their own conclusions.","Examine evidence fairly; if the thought is accurate, shift to problem-solving.","Decatastrophizing, double-standard and perspective-taking widen the view; they are not reassurance.","The downward arrow reveals underlying beliefs and needs a secure alliance.","Balanced thoughts are believable, not just positive."],
r:["rector","bj21","bur","gp","pad93","clark"]};
R.pad93="Padesky, C. A. (1993, September 24). Socratic questioning: Changing minds or guiding discovery? [Keynote address]. European Congress of Behaviour and Cognitive Therapies, London, UK.";
R.clark="Clark, G. I., & Egan, S. J. (2015). The Socratic method in cognitive behavioural therapy: A narrative review. Cognitive Therapy and Research, 39(6), 863–879.";

G[6]={o:["Use self-monitoring and activity scheduling with pleasure and mastery ratings","Introduce behavioural activation and grade tasks to fit a client’s energy and values","Teach assertiveness, communication skills and structured problem-solving","Design a behavioural experiment that tests a specific prediction","Adapt behavioural methods to cultural context and individual circumstances"],
L:[
{t:"7.1 Self-monitoring and activity scheduling",
p:["Behavioural methods begin with observation. In self-monitoring, the client records what they do, when, and how they feel, usually with ratings of pleasure (enjoyment) and mastery (sense of accomplishment) from 0 to 10 (Rector, 2010; Beck, 2021). Recording what actually happens corrects memory that is shaped by low mood, and often reveals links: mood may rise after contact with a friend or fall after hours of scrolling. Begin with a simple log, explain its purpose, and review it together at the next session.",
"Activity scheduling then plans activities in advance, which removes the daily decision of whether to start. The therapist and client choose a small number of realistic activities and write down day and time. Problems to expect include forgetting, setting tasks too large, and self-criticism when tasks are missed. Treat a missed activity as information, not failure: ask what got in the way and adjust. Reinforcement matters here as in Module 2: pairing an activity with a small reward or a social contact makes it more likely to be repeated (Skinner, 1953)."],
cs:"Teaching example (fictional). Tomás (from Module 2), unemployed for four months, spends most days in bed or at his phone. His log shows mood of 3/10 on days with no outings and 5/10 on the two days he met a friend. He and his therapist notice the contrast together.",
ex:"Keep a two-day activity log with hourly entries and rate pleasure and mastery (0–10). Write two patterns you notice.",
q:{q:"Why record pleasure and mastery ratings?",o:["To prove the client is lazy","To show how activities relate to mood and to correct low-mood memory biases","To avoid planning","To replace therapy"],a:1,e:"Ratings give objective information about which activities matter, often contradicting the belief that nothing helps (Rector, 2010; Beck, 2021)."}},
{t:"7.2 Behavioural activation and graded tasks",
p:["Behavioural activation (BA) is a structured treatment that increases engagement in valued, rewarding activities to improve mood. A component analysis of CBT for depression found that behavioural activation alone performed comparably to the full cognitive therapy package (Jacobson et al., 1996), and a later trial found it comparable to cognitive therapy and to antidepressant medication in acute treatment (Dimidjian et al., 2006). These findings are influential, but they come from specific trials and should not be presented as a final verdict. Martell et al. (2010) offer a detailed clinician’s guide.",
"BA works best when activities connect to the client’s values, such as family, community, faith or work, and not only to pleasure. Grading means breaking a task into steps that match the client’s current energy: instead of “clean the apartment,” start with “wash the dishes for 10 minutes.” Use the principle of “outside-in”: acting first, even without motivation, can bring mood change later. Check for barriers (lack of money, childcare, safety, language, weather) and plan around them. When a client has severe depression with risk, safety comes first, and consult your supervisor."],
cs:"Teaching example (fictional). Tomás agrees to try BA. His therapist introduces the idea and works out a first step.",
dlg:[["Therapist","You said you feel like doing nothing. What usually happens to your mood after a day of doing nothing?"],["Client","It gets worse. I feel useless."],["Therapist","What did you used to do that mattered to you?"],["Client","I played cricket on weekends. And I called my brother."],["Therapist","Could we try one small step this week? Perhaps a 10-minute call to your brother on Sunday?"],["Client","I can try that. I’ll rate how I feel before and after."]],
why:"Clinical reasoning: the therapist links inactivity to mood using the client’s own experience, explores values through past activities, and proposes a small, specific step. The client proposes the rating, which builds ownership and generates data to review next session.",
ex:"List five activities linked to your values. Choose one and break it into three graded steps. Write how you would explain BA to a client in two sentences.",
q:{q:"What is a graded task?",o:["A task graded pass or fail","A large task broken into manageable steps that match current energy","A difficult task given first","A task assigned by a supervisor"],a:1,e:"Grading makes the first step achievable and builds mastery (Martell et al., 2010)."}},
{t:"7.3 Assertiveness, communication and problem-solving",
p:["Assertiveness training teaches clients to express needs and opinions clearly and respectfully. It is often practised through behavioural rehearsal: the therapist and client role-play a difficult conversation, give feedback and repeat. Useful steps include stating the situation, naming one’s feeling or need, making a specific request and listening to the response. Cultural norms differ on directness, hierarchy and family roles, so the therapist should ask what style fits the client’s relationships and values and avoid assuming that Western norms of directness are the goal.",
"Problem-solving therapy addresses real problems directly. A common sequence is: define the problem specifically, generate many options, evaluate pros and cons, choose and plan, then try it and review (D’Zurilla & Nezu, 2007). Choose problem-solving over thought challenging when the situation can be changed and the thought is accurate, for example a lack of social contacts or a rent dispute. For newcomers, practical problems (housing, work, documents) are real and may require referrals to settlement and legal services as part of the plan."],
cs:"Teaching example (fictional). Mei needs to ask her supervisor for a schedule change to attend language classes. She practises the request in a role-play: “I would like to change my Thursday shift so I can attend class. Could we discuss options?” Her therapist gives feedback on tone and clarity, then they plan what to say if the answer is no.",
ex:"Write a three-sentence assertive request for a situation of your own. Then list two possible responses and how you would reply.",
q:{q:"When is problem-solving preferable to challenging a thought?",o:["When the situation is changeable and the thought is accurate","When the thought is clearly false","Never","Only when the client prefers it"],a:0,e:"If the problem is real and changeable, direct action is more useful than restructuring (D’Zurilla & Nezu, 2007; Beck, 2021)."}},
{t:"7.4 Designing behavioural experiments",
p:["A behavioural experiment tests a specific belief by doing something and observing what happens. It is among the most powerful CBT methods because people tend to trust their own experience more than reasoning alone (Bennett-Levy et al., 2004). A good experiment follows a sequence: identify the belief, turn it into a specific prediction with a belief rating, plan an experiment that could disconfirm the prediction, anticipate problems, carry it out, and record what happened and what was learned.",
"Design carefully. The prediction must be testable (“people will stare at me for more than a few seconds”), not vague. Make the experiment safe, ethical and acceptable to the client; do not expose a client to real danger, humiliation or legal risk. Plan for several outcomes, including the feared one. Remove safety behaviours during the test where possible, since they confound the result. After the experiment, ask what the result means and what to do next. Exposure for anxiety disorders, trauma and OCD is a related but more specialized area (Module 8) that requires specific training and supervision."],
cs:"Teaching example (fictional). Dev (from Module 6) fears that if he asks a question in a team meeting, colleagues will think he is unprepared. With his therapist he designs an experiment.",
dlg:[["Therapist","What exactly do you predict will happen if you ask one question?"],["Client","Someone will roll their eyes, and my manager will think I’m unprepared. About 70% sure."],["Therapist","What could we observe to find out? And what might get in the way?"],["Client","I could ask one clarifying question and see how people react. I might skip it at the last minute."],["Therapist","What would help you follow through?"],["Client","Writing the question down beforehand, and telling you I’ll do it."],["Therapist","Let’s record your prediction and what happens, and talk about it next week."]],
why:"Clinical reasoning: the therapist asks for a specific, rated prediction and what would count as evidence, then anticipates obstacles and supports follow-through. Writing the question beforehand is a reasonable aid, but the therapist will later check whether it works as a safety behaviour.",
ex:"Design one behavioural experiment for a belief of your own. Write the prediction with a belief rating, the plan, possible problems and how you will judge the result.",
q:{q:"What makes a prediction suitable for a behavioural experiment?",o:["It is vague and general","It is specific, observable and could be disconfirmed","It is always true","It cannot be tested"],a:1,e:"Specific, testable predictions allow clear learning (Bennett-Levy et al., 2004)."}}],
x:'<div class="card"><h3>Worksheet 8: Behavioural activation schedule</h3><p><b>Instructions.</b> Plan one to three small activities for each day, tied to your values. After each, rate pleasure (P) and mastery (M) from 0 to 10, and note what you learned.</p><div class="tw"><table><tr><th>Day and time</th><th>Planned activity (value)</th><th>P (0–10)</th><th>M (0–10)</th><th>What I noticed</th></tr><tr><td>Sun, 4 pm</td><td>10-minute call to my brother (family)</td><td>6</td><td>5</td><td>Felt lighter afterward</td></tr><tr><td style="height:80px"></td><td></td><td></td><td></td><td></td></tr></table></div></div><div class="card"><h3>Worksheet 9: Behavioural experiment</h3><p><b>Instructions.</b> Complete the first four columns before the experiment, and the last three afterward. Choose an experiment that is safe, ethical and acceptable to you.</p><div class="tw"><table><tr><th>Belief</th><th>Prediction (0–100)</th><th>Experiment</th><th>Possible problems</th><th>What happened</th><th>What I learned</th><th>Next step</th></tr><tr><td>Asking a question makes me look unprepared</td><td>Colleagues will react negatively (70)</td><td>Ask one clarifying question in the team meeting</td><td>Skipping it; wording</td><td>Manager answered; no one reacted</td><td>My prediction was too high (now 30)</td><td>Ask two questions next week</td></tr><tr><td style="height:80px"></td><td></td><td></td><td></td><td></td><td></td><td></td></tr></table></div></div>',
s:["Self-monitoring reveals the link between activity and mood.","Behavioural activation uses small, graded, values-linked steps.","Assertiveness and problem-solving are adapted to culture and real circumstances.","Behavioural experiments test specific, rated predictions safely and ethically."],

G[7]={o:["Explain how avoidance and safety behaviours maintain anxiety","Build a fear hierarchy collaboratively and explain graded exposure to a client","Distinguish in-vivo from imaginal exposure and know when each is used","Plan, monitor and review exposure safely, and recognize when specialized training or referral is needed"],
L:[
{t:"8.1 Avoidance cycles and safety behaviours",
p:["Anxiety is partly maintained by what people do to reduce it. Avoiding a feared situation brings immediate relief, which reinforces avoidance, and the person never learns whether the feared outcome would have occurred (Mowrer, 1947; Rector, 2010). Cognitive accounts add that safety behaviours, such as carrying water everywhere in case of panic or rehearsing every sentence, can prevent disconfirmation of the fear (Salkovskis, 1991; Clark, 1999). The result is a cycle: trigger, threat prediction, anxiety, avoidance or safety behaviour, relief, and a stronger prediction next time.",
"Mapping the cycle with the client is an essential first step because it explains why the proposed treatment, approaching the feared situation, is logical and not cruel. Avoidance can be overt (not going) or subtle (going but leaving early, distracting oneself, using alcohol). Assess the full range. Ask what the client is trying to prevent, what they predict would happen, and what it costs them to avoid. Avoidance also has real costs for newcomers, such as skipping language classes or interviews, which compounds stress."],
cs:"Teaching example (fictional). Daniel (from Module 1) avoids elevators after being stuck in one. He takes the stairs to his seventh-floor workplace, arrives exhausted and has turned down a job on the 20th floor. His therapist maps the cycle with him and asks what he predicts would happen in an elevator.",
ex:"Map an avoidance cycle for a fear of your own or a fictional client’s. Include one subtle safety behaviour and one cost of avoiding.",
q:{q:"Why do safety behaviours maintain anxiety?",o:["They make the situation more dangerous","They let the person credit safety to the behaviour, which blocks learning that the feared outcome is unlikely","They are always visible","They increase exposure"],a:1,e:"Safety behaviours prevent disconfirmation of threat beliefs (Salkovskis, 1991; Clark, 1999)."}},
{t:"8.2 Fear hierarchies and graded exposure",
p:["Exposure therapy asks a client to approach feared situations or sensations deliberately, repeatedly and without relying on avoidance or safety behaviours, so that new learning can occur (Rector, 2010; Abramowitz et al., 2019). The classic explanation was habituation: anxiety declines during repeated exposure (Foa & Kozak, 1986). More recent models emphasize inhibitory learning, in which exposure creates new, competing associations that the feared outcome does not occur, or is tolerable (Craske et al., 2014). The distinction affects practice. For instance, the goal may be to test expectations and learn that anxiety is tolerable, not only to wait for distress to fall. Present both models as current ideas, since the field continues to develop.",
"A fear hierarchy is a ranked list of feared situations, each rated 0–100 for expected distress, often called SUDS. Build it together, include a range from mild to severe, and use concrete, repeatable items. Begin with moderate items, repeat until the prediction is disconfirmed or the client’s confidence grows, and move up gradually. Gradual exposure is the usual approach, but the pace should be collaborative and consented to, not forced. Variation, for example practising in different places and at different times, supports learning that generalizes."],
cs:"Teaching example (fictional). Daniel and his therapist build an elevator hierarchy. The therapist then explains what exposure is and why.",
dlg:[["Therapist","We’ll make a ladder of elevator situations, from easy to hard, and rate each by how anxious you’d expect to feel. What would be a very easy step?"],["Client","Standing near the elevator without going in. Maybe 20."],["Therapist","Good. And a really hard one?"],["Client","Riding ten floors in a crowded elevator. About 95."],["Therapist","We won’t start there. We’ll begin around the middle, repeat each step until you notice your predictions don’t come true, then move up. You decide when we move on. How does that sound?"],["Client","Scary, but it makes sense. I just don’t want to be tricked into it."],["Therapist","No tricks. Every step is planned together and you can stop any time."]],
why:"Clinical reasoning: the therapist uses the client’s language to build the ladder, explains the logic of gradual, repeated practice, and states that the client controls the pace. The client’s fear of being “tricked” is welcomed as important information about trust and consent, which is more important than speed.",
ex:"Write a six-item fear hierarchy for a fear of your own or a fictional client’s, with a 0–100 rating for each item. Make each step specific and repeatable.",
q:{q:"Which description of exposure fits current thinking best?",o:["Forcing a client into the most feared situation first","Planned, repeated, consented approach to feared situations to test predictions and build new learning","Distraction until anxiety fades","Avoiding anxiety completely"],a:1,e:"Exposure is collaborative, planned and repeated; models include habituation and inhibitory learning (Craske et al., 2014)."}},
{t:"8.3 In-vivo and imaginal exposure",
p:["In-vivo exposure takes place in real situations: entering an elevator, speaking in a meeting, touching a doorknob. It is the usual method for specific phobias, social anxiety, agoraphobia and many OCD presentations. Interoceptive exposure deliberately brings on feared body sensations, such as dizziness, in panic disorder, and requires medical screening. Imaginal exposure uses vivid, detailed imagery of a feared scenario, often when real exposure is impractical or the feared outcome is a thought, memory or consequence, and it is used in treatments for worry, OCD and trauma (Abramowitz et al., 2019).",
"Exposure for post-traumatic stress disorder, such as prolonged exposure, has strong evidence in some guidelines, but it should be delivered only by clinicians trained in the specific protocol and under supervision (Foa et al., 2007). Do not attempt trauma-focused imaginal exposure after reading a summary like this one. Choose the type of exposure to match the problem, the client’s preferences and the evidence, and recognize that for some clients, stabilization, skills or other approaches should come first."],
cs:"Teaching example (fictional). Leila (from Module 3) worries that she will make her landlord angry. Real exposure is possible, such as phoning him, and the therapist and Leila also write a brief imaginal script of her feared scene, which she reads aloud in session. Her trauma history is not the focus, so the therapist stays within a specific, non-trauma protocol and consults her supervisor.",
ex:"List one problem for which in-vivo exposure is suitable, one for which imaginal exposure may be suitable, and one for which you would refer for specialized training.",
q:{q:"Who should deliver trauma-focused prolonged exposure?",o:["Anyone who has read about it","Clinicians trained in the protocol, with supervision","Only the client alone","Only medical staff"],a:1,e:"Trauma-focused exposure requires specific training and supervision (Foa et al., 2007)."}},
{t:"8.4 Planning, monitoring and safety considerations",
p:["Plan each exposure in advance: specify the situation, the feared prediction and its rating, what safety behaviours to drop, how long to stay, and how success will be judged. Repeat tasks often, ideally several times a week, and record ratings during and after to review learning. Debrief by asking what was predicted, what happened, and what the client learned (Craske et al., 2014). Between sessions, practice becomes homework (Worksheet 11).",
"Safety is part of the plan. Before starting, review medical conditions (for example heart or respiratory problems relevant to interoceptive tasks, or pregnancy), substance use, suicidal thoughts, dissociation and recent trauma. Explain the rationale, obtain informed consent and agree on a way to pause. Rector (2010) notes that some medications, notably benzodiazepines, may interfere with the learning that exposure depends on. Only the prescriber makes medication decisions, and the therapist can communicate with the prescriber with the client’s consent. Take cultural context seriously: a feared situation may carry social or religious meaning, and exposure tasks should respect the client’s values."],
cs:"Teaching example (fictional). Daniel practises riding one floor with his therapist, then alone. The next week he reviews his record.",
dlg:[["Therapist","Let’s look at your record. What did you predict, and what happened?"],["Client","I predicted I’d panic and get stuck. I rated it 80. I was anxious, about 60, but the doors opened and I got out."],["Therapist","What do you make of that?"],["Client","That I can handle it more than I thought. But I still held the rail the whole time."],["Therapist","Good observation. What might you learn if we practised without holding the rail?"]],
why:"Clinical reasoning: the therapist reviews prediction against outcome, which is the learning point, and asks open questions about meaning. The client’s mention of holding the rail reveals a subtle safety behaviour, which the therapist notes and gently targets in the next step.",
ex:"Write an exposure plan for the first step on your hierarchy: situation, prediction (0–100), safety behaviours to drop, duration, and how you will measure learning. List two safety checks you would complete first.",
q:{q:"What should a therapist do when a client holds the rail throughout an exposure?",o:["Ignore it","Note it as a safety behaviour and plan a step without it, collaboratively","Stop all exposure","Tell the client they failed"],a:1,e:"Safety behaviours can limit learning, so they are identified and gradually dropped with the client’s agreement (Salkovskis, 1991)."}}],
x:'<div class="card"><h3>Worksheet 10: Fear hierarchy</h3><p><b>Instructions.</b> List situations connected to your fear from easiest to hardest. Rate expected distress for each (0–100). Choose specific situations you can repeat, and agree the order with your therapist or supervisor.</p><div class="tw"><table><tr><th>Step</th><th>Example (Daniel, fictional)</th><th>Expected distress (0–100)</th><th>Your item</th><th>Your rating</th></tr><tr><td>1</td><td>Stand near the elevator</td><td>20</td><td style="height:40px"></td><td></td></tr><tr><td>2</td><td>Step in with the door held</td><td>35</td><td></td><td></td></tr><tr><td>3</td><td>Ride one floor with therapist</td><td>50</td><td></td><td></td></tr><tr><td>4</td><td>Ride one floor alone</td><td>65</td><td></td><td></td></tr><tr><td>5</td><td>Ride three floors alone</td><td>80</td><td></td><td></td></tr><tr><td>6</td><td>Ride ten floors in a crowd</td><td>95</td><td></td><td></td></tr></table></div></div><div class="card"><h3>Worksheet 11: Exposure monitoring tracker</h3><p><b>Instructions.</b> Fill in the first columns before each practice and the rest during and after. Repeat each step until you have learned what you need.</p><div class="tw"><table><tr><th>Date</th><th>Situation</th><th>Prediction (0–100)</th><th>Distress before</th><th>Distress peak</th><th>Distress after</th><th>What happened and what I learned</th></tr><tr><td>Nov 3</td><td>One floor, alone</td><td>I’ll panic and get stuck (80)</td><td>60</td><td>60</td><td>35</td><td>Doors opened; I handled it. I held the rail, so next: without it.</td></tr><tr><td style="height:80px"></td><td></td><td></td><td></td><td></td><td></td><td></td></tr></table></div></div>',
s:["Avoidance and safety behaviours maintain anxiety by blocking new learning.","A fear hierarchy supports graded, repeated, consented exposure.","In-vivo and imaginal exposure suit different problems; trauma-focused exposure requires specialized training.","Plan, monitor, review and screen for safety; the client controls the pace."],

R.fk="Foa, E. B., & Kozak, M. J. (1986). Emotional processing of fear: Exposure to corrective information. Psychological Bulletin, 99(1), 20–35.";

G[8]={o:["Explain why CBT is tailored to each condition and not applied as one generic protocol","Describe the presentation, maintaining cycle and main CBT interventions for twelve common presentations","Identify assessment priorities and safety issues for each","Recognize limits of this course and when to refer or seek specialized supervision"],
L:[
{t:"9.1 Depression, generalized anxiety and panic disorder",
p:["Depression. Presentation: low mood or loss of interest, fatigue, sleep and appetite change, hopelessness. Maintaining cycle: low activity leads to less reward, which lowers mood further, while negative thinking and rumination add to the cycle (Beck et al., 1979). Assessment: PHQ-9, risk, history of mania or hypomania (CBT for depression is not an adequate plan for active mania), substance use and medical causes. Interventions: behavioural activation, thought records, problem-solving, and later belief work (Modules 6 and 7). CANMAT 2023 lists CBT among first-line psychotherapies for major depressive disorder and discusses combined treatment for more severe presentations (Lam et al., 2024). Refer or consult when risk is high, symptoms are severe or psychotic, or there is no response.",
"Generalized anxiety. Presentation: persistent, hard-to-control worry about many topics, with tension and poor sleep. Maintaining processes: worry is often kept going by intolerance of uncertainty, beliefs that worry is useful, and avoidance of problem-solving or of feared images (Dugas & Robichaud, 2007). Interventions: worry monitoring, distinguishing solvable from unsolvable worries, problem-solving for the first, behavioural experiments that test the need for certainty, and reducing reassurance seeking. GAD-7 tracks progress (Spitzer et al., 2006).",
"Panic disorder. Presentation: recurrent, sudden surges of fear with body symptoms, and fear of further attacks. Cognitive model: harmless sensations such as a racing heart are catastrophically misread (“I’m having a heart attack”), which raises anxiety and the sensations themselves (Clark, 1986). Interventions: explaining the cycle, interoceptive exposure to feared sensations, behavioural experiments, and dropping safety behaviours. Rule out medical causes first. Interoceptive exposure needs medical screening and training."],
cs:"Teaching example (fictional). Amir, 37, has panic attacks on the subway and has started avoiding it. His therapist works through the cycle with him.",
dlg:[["Therapist","Take the last attack. What was the first sensation you noticed?"],["Client","My heart started pounding."],["Therapist","And what went through your mind?"],["Client","That I was having a heart attack and would collapse."],["Therapist","What happened to your fear after that thought?"],["Client","It shot up, and so did my heartbeat."],["Therapist","So the thought made the sensation stronger. Shall we draw that loop and then plan how to test it, after your doctor confirms your heart is healthy?"]],
why:"Clinical reasoning: the therapist traces sensation, interpretation and escalation in the client’s own words, which makes the model personal. The mention of medical clearance reflects the need to rule out physical causes before treating a symptom as panic.",
ex:"Draw the maintaining cycle for depression and for panic disorder. Note one difference in the main intervention for each.",
q:{q:"In panic disorder, what is central to the cognitive model?",o:["Chronic low mood","Catastrophic misinterpretation of body sensations","Compulsive rituals","Flashbacks"],a:1,e:"Panic is maintained by misreading sensations as dangerous (Clark, 1986)."}},
{t:"9.2 Social anxiety and specific phobias",
p:["Social anxiety. Presentation: marked fear of negative evaluation in social or performance situations, with avoidance or endurance with distress. The Clark and Wells (1995) model emphasizes self-focused attention, an internal impression of how one appears, and safety behaviours (rehearsing, avoiding eye contact) that reduce natural interaction and confirm fears. Interventions: identifying predictions, shifting attention outward, dropping safety behaviours, video or other feedback, and behavioural experiments. Assess cultural norms: modesty, deference and reserve may be valued in some communities and should not be pathologized.",
"Specific phobias. Presentation: intense, out-of-proportion fear of an object or situation (animals, heights, flying, injections) with avoidance. Maintaining cycle: avoidance and relief (Module 8). Intervention: graded in-vivo exposure, which can often be completed in a small number of sessions. Fear of blood or injury differs because of fainting; it uses a technique called applied tension, so it should be taught by a trained clinician. Limits: if a fear is reasonable, for example fear of a hazardous workplace, the right response is practical problem-solving."],
cs:"Teaching example (fictional). Hana (from Module 2) fears speaking in meetings. Her plan: predict, drop scripting, ask one question, review. Separately, Jamal has a fear of needles that stops him from receiving necessary blood tests, and his therapist coordinates with his doctor for a graded plan.",
ex:"List three safety behaviours common in social anxiety and one experiment for each.",
q:{q:"In the Clark and Wells model, why do safety behaviours maintain social anxiety?",o:["They prevent disconfirmation and can make the person seem awkward","They are always helpful","They remove all fear","They are unrelated to anxiety"],a:0,e:"Safety behaviours block learning and can alter interaction in unhelpful ways (Clark & Wells, 1995)."}},
{t:"9.3 Obsessive-compulsive disorder and post-traumatic stress disorder",
p:["OCD. Presentation: intrusive, unwanted thoughts, images or urges (obsessions) and repetitive behaviours or mental acts (compulsions) performed to reduce distress or prevent harm. Maintaining processes: appraising intrusions as meaningful or dangerous, and relieving distress with compulsions, avoidance and reassurance, which prevents learning (Salkovskis, 1985). First-line CBT is exposure and response prevention (ERP), in which the client faces triggers and resists compulsions (Abramowitz et al., 2019). It requires specialist training. Help clients and families to reduce accommodation, such as repeated reassurance.",
"PTSD. Presentation: re-experiencing, avoidance, negative changes in thought and mood, and hyperarousal after trauma. Cognitive model: the trauma memory is poorly integrated and the person holds threatening appraisals of the trauma and its aftermath (Ehlers & Clark, 2000). Trauma-focused CBT includes prolonged exposure (Foa et al., 2007) and cognitive processing therapy (Resick et al., 2017). These require specific training and supervision. Screen for risk, dissociation, substance use and current safety. For refugees and newcomers, ongoing stressors such as insecurity, family separation and discrimination may need attention alongside the trauma work, and interpreter-mediated therapy needs planning. Stabilization and safety come first for many clients."],
cs:"Teaching example (fictional). Sara, 28, repeatedly checks that the stove is off and asks her husband to confirm. Her therapist, trained in ERP, plans graded exposure with response prevention and involves her husband in reducing reassurance.",
dlg:[["Client","Can you just tell me it’s fine? I need to hear it’s fine."],["Therapist","I can hear how uncomfortable this is. If I reassure you now, what usually happens in an hour?"],["Client","I feel better, then the doubt comes back."],["Therapist","So reassurance helps briefly and keeps the doubt coming back. Could we try sitting with the doubt for ten minutes together and see what happens?"]],
why:"Clinical reasoning: the therapist acknowledges the distress without giving reassurance, then helps the client see the pattern from her own experience. The invitation is collaborative and time-limited, which prepares ERP. This is a teaching example only; ERP requires specialist training.",
ex:"Write how you would respond to a client who asks for reassurance repeatedly, without giving it and without sounding cold.",
q:{q:"Which approach is first-line CBT for OCD?",o:["Distraction","Exposure and response prevention","Reassurance","Thought stopping"],a:1,e:"ERP targets the cycle of intrusion, compulsion and relief (Abramowitz et al., 2019); it requires specialist training."}},
{t:"9.4 Eating-related difficulties and substance use",
p:["Eating-related difficulties. Enhanced CBT (CBT-E) is a well-studied transdiagnostic treatment for eating disorders, particularly bulimia nervosa and binge-eating disorder, targeting over-evaluation of shape and weight, restriction and binge cycles (Fairburn, 2008). Assessment must include medical risk, which can be serious even when a client looks well, and risk of self-harm. Anorexia nervosa and any case with medical instability need a specialist, medically supervised program. General practitioners and therapists should refer promptly. Do not offer numerical weight, calorie or exercise targets outside a supervised program.",
"Substance use. CBT approaches include functional analysis of use, identifying high-risk situations, building coping skills and planning for lapses (Marlatt & Gordon, 1985). Motivational interviewing is often combined to build commitment to change (Miller & Rollnick, 2013). Abstinence is not the only goal; harm reduction is legitimate. Withdrawal from alcohol or benzodiazepines can be medically dangerous and needs medical supervision. Screen for co-occurring depression, anxiety and trauma, and coordinate with addiction services and the client’s physician."],
cs:"Teaching example (fictional). Tobias, 46, drinks in the evenings to manage work stress. With his therapist he identifies his three highest-risk situations, plans alternative coping for each, and is referred to his doctor to discuss safe ways to cut back.",
ex:"Do a functional analysis of a habit (not necessarily substance-related): trigger, behaviour, short-term and long-term consequences, and an alternative.",
q:{q:"Why is medical supervision important when a client with heavy alcohol use stops abruptly?",o:["Withdrawal can be dangerous","It is a legal formality","Therapy cannot proceed without it","It prevents motivation"],a:0,e:"Alcohol and benzodiazepine withdrawal can be medically serious and needs supervision."}},
{t:"9.5 Insomnia, chronic pain and psychosis-related presentations",
p:["Insomnia. Cognitive behavioural therapy for insomnia (CBT-I) is recommended as a first-line treatment for chronic insomnia disorder (Edinger et al., 2021). Components include stimulus control, sleep restriction or consolidation, relaxation, and addressing unhelpful beliefs and worry about sleep. Sleep restriction can raise daytime sleepiness, so screen for driving risks, bipolar disorder, seizure disorders and sleep apnea, and use trained supervision. Note that sleep hygiene education alone is usually insufficient.",
"Chronic pain. Pain is real and the client is not “imagining” it. CBT-based approaches help people to manage the impact of pain: pacing activity, increasing valued activity, addressing catastrophizing and fear of movement, and improving sleep and mood. A Cochrane review found that psychological therapies can have small benefits for pain-related disability, mood and catastrophizing, with limited effect on pain intensity (Williams et al., 2012). Coordinate with medical care.",
"Psychosis-related presentations. CBT for psychosis (CBTp) works alongside medication to reduce distress from voices and beliefs, improve coping and support recovery (Wykes et al., 2008). It is delivered by clinicians with specialist training, within a team. It is outside the scope of introductory CBT, and general programs may exclude people with active psychosis. If you suspect psychosis, refer and consult your supervisor."],
cs:"Teaching example (fictional). Rosa, 52, has chronic back pain and has stopped going to the park. Her therapist and physiotherapist agree on gradual pacing, and her thought record addresses “movement will damage me.” Separately, Kwame, 30, reports hearing voices; his clinician refers him to an early intervention program.",
ex:"List three differences between how you would explain CBT to a client with insomnia and to a client with chronic pain.",
q:{q:"Which is true about CBT and chronic pain?",o:["It assumes the pain is imaginary","It helps people manage the impact of pain and works alongside medical care","It replaces medical care","It is only for severe pain"],a:1,e:"CBT addresses coping, activity and thoughts about pain, in coordination with medical care (Williams et al., 2012)."}},
{t:"9.6 Limits and referral considerations",
p:["One generic protocol does not suit every condition. The cases above differ in their maintaining processes, so interventions differ: activation for depression, exposure for phobias, ERP for OCD, trauma-focused methods for PTSD. Transdiagnostic approaches, such as the Unified Protocol, aim to treat shared processes in emotional disorders, but they too are structured treatments for which training is needed (Barlow et al., 2017). Choose the approach that fits the formulation, the evidence for the condition, and your training.",
"Refer or seek supervision when you see: active suicidality or risk to others, mania or psychosis, medically unstable eating disorders, dangerous substance withdrawal, complex trauma beyond your training, or no improvement after an adequate trial. In Ontario, practise within the scope of your registration and competence (CRPO, n.d.; OCSWSSW, 2023). Knowing when to refer is part of competent practice. Crisis resources include 9-8-8 and 911."],
cs:"Teaching example (fictional). A therapist trained in general CBT begins to treat a client for PTSD but notices dissociation and heavy drinking. She consults her supervisor, focuses on stabilization and safety, and refers for trauma-focused therapy with a specialist.",
ex:"Create a personal referral map: for each of the twelve presentations, write whom you would consult or refer to in your region.",
q:{q:"What is the best response when a presentation is beyond your training?",o:["Continue with a generic protocol","Consult your supervisor and refer to a suitably trained clinician","Stop sessions without explanation","Avoid documenting"],a:1,e:"Competence and referral are ethical requirements (CRPO, n.d.; OCSWSSW, 2023)."}}],
x:'<div class="card"><h3>Table: CBT across conditions</h3><p class="src">A summary for learning, not a treatment protocol.</p><div class="tw"><table><tr><th>Condition</th><th>Key maintaining process</th><th>Main CBT approach</th><th>Refer or consult when</th></tr><tr><td>Depression</td><td>Inactivity, rumination, negative thinking</td><td>Behavioural activation, cognitive therapy</td><td>High risk, mania, psychosis</td></tr><tr><td>Generalized anxiety</td><td>Intolerance of uncertainty, worry beliefs</td><td>Worry work, problem-solving, experiments</td><td>Severe impairment, no response</td></tr><tr><td>Panic disorder</td><td>Catastrophic misreading of sensations</td><td>Psychoeducation, interoceptive exposure</td><td>Medical cause not excluded</td></tr><tr><td>Social anxiety</td><td>Self-focus, safety behaviours</td><td>Experiments, attention shifting</td><td>Severe avoidance, suicidality</td></tr><tr><td>Specific phobia</td><td>Avoidance</td><td>Graded exposure</td><td>Blood or injury fainting: trained clinician</td></tr><tr><td>OCD</td><td>Compulsions, reassurance</td><td>Exposure and response prevention</td><td>Specialist training required</td></tr><tr><td>PTSD</td><td>Threat appraisals, avoidance</td><td>Trauma-focused CBT</td><td>Specialist training required</td></tr><tr><td>Eating difficulties</td><td>Shape and weight over-evaluation, restriction</td><td>CBT-E</td><td>Medical instability, anorexia nervosa</td></tr><tr><td>Substance use</td><td>Use as coping, cue-driven</td><td>Relapse prevention, motivational methods</td><td>Withdrawal risk, co-occurring disorders</td></tr><tr><td>Insomnia</td><td>Conditioned arousal, sleep worry</td><td>CBT-I</td><td>Bipolar, seizure, sleep apnea concerns</td></tr><tr><td>Chronic pain</td><td>Fear-avoidance, catastrophizing</td><td>Pacing, activity, coping</td><td>Coordinate with medical team</td></tr><tr><td>Psychosis-related</td><td>Distress about voices or beliefs</td><td>CBTp within a team</td><td>Specialist team</td></tr></table></div></div>',
s:["CBT is tailored to the maintaining processes of each condition.","Exposure-based treatments for OCD and PTSD need specialist training.","Eating disorders, substance withdrawal, psychosis and high risk require medical or specialist input.","Referral and supervision are part of competent, ethical practice."],

G[9]={o:["Conduct a first CBT session that combines assessment, rapport, consent and psychoeducation","Explain how the therapeutic relationship supports CBT technique","Set an agenda, check mood and review homework collaboratively","Use summaries, feedback and documentation to support learning and accountability","Plan and critique a structured 50-minute session"],
L:[
{t:"10.1 The first session and the therapeutic relationship",
p:["The first session has several jobs: build a working relationship, understand the presenting problems, obtain informed consent, introduce the cognitive model and set initial goals. Explain how CBT works (structured, collaborative, skills-focused, with practice between sessions), the likely length of treatment, and what clients can expect from you. Informed consent follows a discussion of benefits, risks, alternatives, fees, confidentiality and its limits, including risk of serious harm and mandatory reporting duties, and should be documented (CRPO, n.d.; OCSWSSW, 2023). If an interpreter is involved or the session is virtual, address privacy, technology and what to do if the connection fails.",
"The therapeutic alliance is not a preliminary to technique. A meta-analysis of alliance and outcome in adult psychotherapy found a consistent association between a stronger alliance and better outcomes (Flückiger et al., 2018). In CBT, the alliance shows in warmth, accurate empathy, agreement on goals and tasks, and openness to feedback (Beck, 2021). Culturally responsive practice means asking about the client’s expectations of therapy and what has helped before, and adjusting your style accordingly. Be cautious about interpreting silence or agreement as consent or understanding."],
cs:"Teaching example (fictional). Naledi (from Module 4) attends her first session. The therapist explains the structure and asks what she hopes for.",
dlg:[["Therapist","Before we start, I’d like to explain how I usually work and hear what you expect. In CBT we set an agenda together, look at links between situations, thoughts and feelings, and practise skills between sessions. How does that sound?"],["Client","It sounds structured. I’m used to just talking."],["Therapist","Talking will be part of it. If at any point the structure doesn’t suit you, please tell me. What would make these sessions worthwhile for you?"],["Client","To feel less alone here, and to stop dreading every email at work."],["Therapist","Thank you. Those two goals give us a good start. Let me also go over confidentiality and its limits, and then we’ll talk about what has been hardest lately."]],
why:"Clinical reasoning: the therapist previews the format, invites disagreement, and asks for the client’s own goals before introducing any technique. Moving to consent and confidentiality at this point respects ethical requirements and shows transparency.",
ex:"Write a three-minute script for explaining CBT to a first-time client, including how you will check for questions and how you will ask for feedback.",
q:{q:"What best describes the role of the therapeutic alliance in CBT?",o:["A preliminary step that can be skipped","An essential part of effective therapy that supports technique","Only relevant in psychodynamic therapy","Unrelated to outcome"],a:1,e:"Alliance is consistently associated with outcome (Flückiger et al., 2018) and underpins collaboration (Beck, 2021)."}},
{t:"10.2 Agenda setting, mood check and homework review",
p:["A typical session structure begins with a brief mood check (and risk check where indicated), a bridge from the previous session, collaborative agenda-setting, and a review of homework before moving to main agenda items (Beck, 2021). The mood check can use a short rating, such as 0–10, or a standard measure like the PHQ-9 or GAD-7 at planned intervals. Agenda items should be specific (“prepare for the meeting on Thursday”), prioritized by the client and fit the time available. A common error is allowing the agenda to be consumed by the week’s events.",
"Homework is central to CBT. A meta-analysis found that clients who complete homework tend to show better outcomes than those who do not (Kazantzis et al., 2010), although such studies cannot by themselves prove causation. Assign tasks that follow from the session, are clearly explained, are rehearsed in the session where possible, and are likely to succeed. Review homework every time. When it has not been done, explore barriers without blame: unclear instructions, too-difficult tasks, lack of time or privacy, or beliefs about the task."],
cs:"Teaching example (fictional). Dev (from Module 7) did not complete the experiment he planned.",
dlg:[["Therapist","Let’s look at the week. How did the meeting experiment go?"],["Client","I didn’t do it. I’m sorry."],["Therapist","No need to apologize. I’m curious what got in the way."],["Client","My manager was in a bad mood, and I thought, today’s not the day."],["Therapist","That’s useful. What did you predict would happen if you asked a question then?"],["Client","That it would be worse than usual. Maybe 85."],["Therapist","So the same prediction showed up, even stronger. Could we make the task smaller, like asking a colleague one question one-to-one, and decide the best time together?"]],
why:"Clinical reasoning: the therapist treats the missed task as information, not failure, and uncovers the thought behind it. Reducing the size of the task keeps the client succeeding and the new plan is made together. The therapist also notes the stronger prediction as material for the next session.",
ex:"Use Worksheet 13 to review a homework task from your own practice or a fictional one. Identify at least one barrier and a way to adjust.",
q:{q:"A client has not done homework. What is the most helpful response?",o:["Criticize the lack of effort","Explore barriers collaboratively and adjust the task","End therapy","Stop assigning tasks"],a:1,e:"Barriers are information; adjusting tasks keeps learning moving (Beck, 2021; Kazantzis et al., 2010)."}},
{t:"10.3 Intervention, summaries and feedback",
p:["After the agenda and homework review, the core of the session delivers one or two interventions from the formulation: a thought record, an activity plan, an experiment design or a problem-solving exercise. Depth is better than breadth. Check understanding during the work, and aim for the client to do most of the work. Whenever the client has made a point or the topic shifts, offer a short summary (“So far we’ve noticed…”), and invite correction. Summaries reduce drift and strengthen memory.",
"End by agreeing homework, asking the client to summarize the main learning in their own words, and seeking feedback: “What was helpful today? Was anything unclear or upsetting? Anything you’d like me to do differently?” Responding without defensiveness to negative feedback builds trust and repairs ruptures early (Beck, 2021). Supervision can be supported by recording sessions with consent and rating them with a tool such as the revised Cognitive Therapy Scale (Blackburn et al., 2001), used for training, not to make judgments about clients."],
cs:"Teaching example (fictional). After a session with Mei (Module 2), the therapist asks for feedback and learns that written homework feels like school. They agree to use voice notes instead.",
ex:"Write three feedback questions for the end of a session, including one that invites criticism.",
q:{q:"Why ask the client to summarize the session in their own words?",o:["To test them","To check understanding and consolidate learning","To shorten the session","To avoid homework"],a:1,e:"Client-generated summaries reveal understanding and help retention (Beck, 2021)."}},
{t:"10.4 Documentation",
p:["Good records support client care, continuity, accountability and legal and regulatory requirements. A CBT note typically records the date, mood and risk, the agenda, interventions, the client’s responses, homework assigned, plans and any consultation. Write facts and clinical reasoning, not speculation. Notes should be accurate, timely and secure. Regulatory colleges set standards for record-keeping, consent and retention, and you should follow those of your own college and your organization (CRPO, n.d.; OCSWSSW, 2023).",
"In Ontario, privacy rules for personal health information, including the Personal Health Information Protection Act, 2004 (PHIPA), apply to health information custodians and their agents, and how it applies to your practice depends on your setting, so check with your organization or college. Clients generally have rights of access to their records. Use language you would be comfortable having the client read. Store records securely, and use secure channels for electronic communication."],
cs:"Teaching example (fictional). A therapist documents a session with Naledi: mood 4/10, no suicidal thoughts reported, agenda items, the thought record completed in session, homework, and the plan for next week. She leaves out unnecessary detail about third parties.",
ex:"Write a 6–8 line clinical note for a fictional session. Check that it is factual, concise and respectful.",
q:{q:"Which is the best approach to clinical notes?",o:["Include speculation and personal opinion","Record accurate, timely, relevant information and clinical reasoning in language you could share","Avoid documenting risk","Keep notes only in memory"],a:1,e:"Records should be accurate, timely, relevant and compliant with standards (CRPO, n.d.; OCSWSSW, 2023)."}},
{t:"10.5 A structured 50-minute session",
p:["The table at the end of this module shows a timed 50-minute session and the reasoning behind each step. In the example, Dev has been working on speaking up in meetings. The therapist begins with a brief mood and risk check, bridges from last week’s plan, and sets an agenda with him: (1) review the one-to-one question task, (2) plan the team-meeting experiment, (3) address a concern about asking for a deadline extension.",
"The therapist reviews homework (Dev asked a colleague a question and it went smoothly, so his prediction dropped from 85 to 40), then spends most of the time designing the team-meeting experiment, including a rating of his prediction and how he will notice the response. Time for the third item is limited, so they agree to place it first on the next agenda. The session ends with a summary by Dev, new homework, and feedback. Real sessions are rarely this tidy. The structure serves the client, and flexibility is appropriate when a crisis or an unexpected need arises."],
cs:"Teaching example (fictional). Dev’s therapist follows the structure but sets it aside for ten minutes when Dev learns his visa is delayed. She returns to the agenda afterward and plans a referral for immigration support.",
ex:"Plan your own 50-minute session for a fictional client using Worksheet 12. Allocate minutes to each step and note the intervention you will use.",
q:{q:"What should happen when a client arrives with an urgent crisis?",o:["Follow the agenda rigidly","Address the crisis first, adapt the structure and return to it when appropriate","Cancel the session","Ignore the crisis"],a:1,e:"Structure serves the client; flexibility is appropriate when needs change (Beck, 2021)."}}],
x:'<div class="card"><h3>Table: a structured 50-minute session (fictional)</h3><div class="tw"><table><tr><th>Minutes</th><th>Step</th><th>Therapist actions</th><th>Reasoning</th></tr><tr><td>0–5</td><td>Mood and risk check; bridge</td><td>Rate mood; ask about safety; recall last session</td><td>Establishes the baseline and continuity</td></tr><tr><td>5–8</td><td>Agenda setting</td><td>Agree three items with the client</td><td>Keeps the session focused and collaborative</td></tr><tr><td>8–15</td><td>Homework review</td><td>Review the task, prediction and result</td><td>Turns experience into learning</td></tr><tr><td>15–40</td><td>Main intervention</td><td>Design the experiment; rehearse; plan for problems</td><td>Depth over breadth</td></tr><tr><td>40–45</td><td>Summary and new homework</td><td>Client summarizes; agree a specific task</td><td>Consolidates learning</td></tr><tr><td>45–50</td><td>Feedback</td><td>Ask what helped and what to change</td><td>Strengthens alliance</td></tr></table></div></div><div class="card"><h3>Worksheet 12: CBT session planning template</h3><p><b>Instructions.</b> Complete before each session; revise afterward.</p><div class="tw"><table><tr><th>Element</th><th>Example (fictional)</th><th>Your plan</th></tr><tr><td>Mood and risk check</td><td>Mood 0–10; ask about safety</td><td style="height:44px"></td></tr><tr><td>Bridge from last session</td><td>Plan to ask a colleague one question</td><td></td></tr><tr><td>Agenda items</td><td>Review task; plan team experiment</td><td></td></tr><tr><td>Homework review</td><td>Prediction 85 to 40</td><td></td></tr><tr><td>Main intervention</td><td>Behavioural experiment design</td><td></td></tr><tr><td>New homework</td><td>Ask one question in the Thursday meeting</td><td></td></tr><tr><td>Feedback questions</td><td>What helped? Anything unclear?</td><td></td></tr></table></div></div><div class="card"><h3>Worksheet 13: Homework review form</h3><p><b>Instructions.</b> Use at the start of the session. Treat non-completion as information.</p><div class="tw"><table><tr><th>Task assigned</th><th>Done? (yes / partly / no)</th><th>What happened</th><th>Barriers</th><th>What was learned</th><th>Adjustment</th></tr><tr><td>Ask a colleague one question</td><td>Yes</td><td>Colleague answered readily</td><td>Nervous beforehand</td><td>Prediction was too high</td><td>Try in a team meeting</td></tr><tr><td style="height:70px"></td><td></td><td></td><td></td><td></td><td></td></tr></table></div></div>',
s:["The first session combines rapport, assessment, consent and psychoeducation.","A standard structure (mood check, agenda, homework, intervention, summary, feedback) supports collaboration.","Homework is reviewed every session and barriers are explored without blame.","Records are accurate, timely and compliant with standards.","Structure serves the client and flexes when needed."],

R.black="Blackburn, I.-M., James, I. A., Milne, D. L., Baker, C., Standart, S., Garland, A., & Reichelt, F. K. (2001). The revised cognitive therapy scale (CTS-R): Psychometric properties. Behavioural and Cognitive Psychotherapy, 29(4), 431–446.";
