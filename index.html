<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cognitive Behavioural Therapy: From Theoretical Foundations to Practical Clinical Application | ICA Counselling and Supervision</title>
<style>
:root{--bg:#f6f9f8;--card:#fff;--ink:#1d2b2a;--mute:#566866;--pri:#1f5f5b;--pri2:#e4f0ed;--acc:#9c4f2c;--line:#d3e0dd;--ok:#2a7d4f;--bad:#b3392f}
@media (prefers-color-scheme:dark){:root{--bg:#101a19;--card:#172423;--ink:#e6efed;--mute:#9db3b0;--pri:#6fc3bb;--pri2:#1d3331;--acc:#e0916e;--line:#2a403e;--ok:#5fc58b;--bad:#f08a80}}
*{box-sizing:border-box}
html{scroll-padding-top:12px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.25;margin:.2em 0 .5em}
header{background:var(--pri);color:#fff;padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
@media (prefers-color-scheme:dark){header{color:#06201d}}
header b{font:700 18px Georgia,serif}
.ht{flex:1 1 280px;min-width:0}.ht .hc{font-size:12.5px;line-height:1.35;opacity:.92}.ht .hp{font:700 20px/1.25 Georgia,"Times New Roman",serif;margin-top:3px;overflow-wrap:anywhere}
.hr{display:flex;align-items:center;gap:10px;flex:0 1 230px;font-size:13px}
.hl{height:38px;width:auto;background:#fff;border-radius:6px;padding:3px 9px;flex:none}
.bar{flex:1;min-width:140px;height:8px;background:rgba(255,255,255,.3);border-radius:4px}.bar i{display:block;height:100%;background:#fff;border-radius:4px;transition:width .3s}
.wrap{display:flex;max-width:1180px;margin:0 auto;gap:22px;padding:20px}
nav{width:270px;flex:none}
nav button{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-bottom:5px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{border-color:var(--pri);background:var(--pri2);font-weight:600}
nav button.done::after{content:" ✓";color:var(--ok);font-weight:700}
nav button.soon{color:var(--mute)}
main{flex:1;min-width:0;max-width:780px}
.dl{max-width:88%;padding:8px 13px;border-radius:14px;margin:8px 0;font-size:15px;line-height:1.55;background:var(--card);border:1px solid var(--line);border-top-left-radius:4px}
.dl .sp{display:block;font:700 12px system-ui,sans-serif;letter-spacing:.04em;color:var(--pri);margin-bottom:2px}
.dl.c{margin-left:auto;border-top-left-radius:14px;border-top-right-radius:4px;background:color-mix(in srgb,var(--acc) 11%,var(--card));border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
.dl.c .sp{color:var(--acc)}
nav button.on{box-shadow:inset 3px 0 0 var(--pri)}
@media(min-width:801px){nav{position:sticky;top:12px;align-self:flex-start;max-height:calc(100vh - 24px);overflow-y:auto;padding-right:2px}}
.les{scroll-margin-top:64px}
#lt{position:sticky;top:0;z-index:5;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 2px;margin:0 0 14px;background:color-mix(in srgb,var(--bg) 94%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
#lt button{font:600 13px system-ui,sans-serif;padding:4px 12px;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;cursor:pointer}
#lt button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
@media (prefers-color-scheme:dark){#lt button.on{color:#06201d}}
@media print{#lt{display:none}}
.ln{color:var(--pri);font-weight:700;display:inline-block;min-width:2.6em}
.toc h3{margin-top:0}
.toc ul{list-style:none;margin:0;padding:0}
.toc li{border-top:1px solid var(--line)}.toc li:first-child{border-top:0}
.toc .tl{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 6px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;border-radius:6px}
.toc .tl:hover{background:var(--pri2)}
#lt .ct{flex:1 1 140px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--mute);padding-left:6px}
main.fo{opacity:0;transform:translateY(-4px);transition:opacity .13s ease-in,transform .13s ease-in}
main.fi{animation:secIn .32s cubic-bezier(.22,.61,.36,1) backwards}
@keyframes secIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main.fo{transition:none;opacity:1;transform:none}main.fi{animation:none}}
@media print{main.fo,main.fi{animation:none;transition:none;opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px 26px;margin-bottom:16px}
.card h3{color:var(--pri);font-size:20px}
.les p{font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.75}
.case{border-left:4px solid var(--acc)}
.tag{font-size:13px;color:var(--acc);font-weight:700}
.note{background:var(--pri2);border-radius:6px;padding:10px 14px;font-size:14px;margin:10px 0}
.src{font-size:13px;color:var(--mute)}
table{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0}th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}th{background:var(--pri2)}
.tw{overflow-x:auto}
textarea,input[type=text]{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
button.p{background:var(--pri);color:#fff;border:0;border-radius:6px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
@media (prefers-color-scheme:dark){button.p{color:#06201d}}
button.p:disabled{opacity:.45;cursor:not-allowed}
button.s{background:transparent;color:var(--pri);border:1px solid var(--pri);border-radius:6px;padding:9px 16px;font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.q{margin:14px 0}.q label{display:block;padding:7px 10px;border:1px solid var(--line);border-radius:6px;margin:5px 0;cursor:pointer}
.fb{margin-top:8px;font-size:14px;padding:8px 12px;border-radius:6px}.fb.ok{background:rgba(42,125,79,.14);color:var(--ok)}.fb.no{background:rgba(179,57,47,.12);color:var(--bad)}
ol.refs{font-size:13px;color:var(--mute);padding-left:22px}ol.refs li{margin-bottom:5px}
#certw{container-type:inline-size;max-width:1000px;margin:0 auto}
#certv{position:relative;aspect-ratio:11/8.5;background:#fff;color:#1d2b2a;border:.9cqw solid #1f5f5b;outline:.25cqw solid #9c4f2c;outline-offset:-1.7cqw;padding:3.4cqw 4.8cqw 2.8cqw;display:flex;flex-direction:column;justify-content:space-between;text-align:center;font-family:Georgia,"Times New Roman",serif}
#certv .ch{display:flex;justify-content:center;align-items:center}
#certv .org{font-size:1.45cqw;letter-spacing:.12em;text-transform:uppercase;color:#1f5f5b;font-weight:700;line-height:1.5}
#certv .org small{display:block;font-size:1cqw;letter-spacing:.06em;color:#566866;font-weight:400;text-transform:none}
#certv .lg{display:flex;align-items:center}#certv .lg img{height:9.5cqw;width:auto;max-width:34cqw;object-fit:contain}
#certv .mono{display:none;width:7.2cqw;height:7.2cqw;border:.3cqw solid #1f5f5b;border-radius:50%;align-items:center;justify-content:center;font:700 2.4cqw Georgia,serif;color:#1f5f5b}
#certv h1{font-size:4.3cqw;color:#1f5f5b;margin:0;letter-spacing:.02em}
#certv .sub{font-size:1.4cqw;color:#566866;margin:.4cqw 0 0}
#certv .nm{font:italic 4.4cqw Georgia,serif;border-bottom:.2cqw solid #9c4f2c;display:inline-block;padding:0 3cqw;margin:.6cqw 0}
#certv p{margin:0;font-size:1.5cqw;line-height:1.5}
#certv .mh{font-size:1.2cqw;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#1f5f5b;margin-bottom:.6cqw}
#certv ul{list-style:none;padding:0;margin:0;columns:2;column-gap:3cqw;text-align:left;font-size:1.08cqw;line-height:1.55}
#certv li{break-inside:avoid}
#certv .bt{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:2cqw;align-items:end;font-size:1.15cqw}
#certv .bt b{display:block;font-size:1.3cqw}
#certv .sg{border-top:.15cqw solid #1d2b2a;padding-top:.5cqw}
#certv .ft{font-size:.9cqw;color:#566866;line-height:1.5}
@page{size:letter landscape;margin:0}
@media print{html,body{background:#fff}body *{visibility:hidden}#certw,#certw *{visibility:visible}#certw{position:fixed;left:0;top:0;width:11in;max-width:none}#certv{width:11in;height:8.5in;aspect-ratio:auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(max-width:800px){.wrap{flex-direction:column;padding:12px}nav{width:100%;display:flex;gap:6px;overflow-x:auto}nav button{white-space:nowrap;width:auto}.card{padding:16px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

var L1=[
{t:"1.1 What CBT is and is not",
p:["Cognitive behavioural therapy (CBT) is best understood as a family of structured, time-limited, problem-focused psychotherapies. They rest on a plain proposition: the way a person interprets an event, and what they then do about it, strongly shapes how they feel, and both interpretations and actions can be examined and changed. Rector (2010) describes CBT as a collaborative, present-focused treatment in which clients learn skills they can keep using after therapy ends, and Bhattacharya et al. (2013) describe it in similar terms. J. S. Beck (2021) calls the aim “becoming your own therapist”.",
"Three features distinguish CBT in practice. First, collaborative empiricism: therapist and client treat thoughts as hypotheses to be tested against evidence, not as facts to be argued with. Second, a here-and-now focus. The past is explored when it explains a current pattern, but sessions mainly address present problems. Third, an emphasis on skills and practice between sessions. Homework is not an optional extra; it is how learning moves from the consulting room into daily life.",
"It is equally important to say what CBT is not. It is not “positive thinking”, and a good CBT therapist never tells a client that their feelings are wrong. Its goal is accuracy and usefulness of thought, not cheerfulness. Nor is it one fixed protocol. “CBT” is an umbrella term, and the treatment for panic disorder differs substantially from the treatment for depression or OCD (Dobson, 2010). Module 9 returns to this point in detail."],
cs:"Teaching example (fictional). Meera, 34, recently arrived in Mississauga, has felt low and withdrawn for two months. Her family doctor suggests CBT. Meera asks, “Will we just talk about my childhood?” Her clinician explains that CBT focuses mainly on current difficulties and skills, that earlier experiences will be explored if they help explain the present, and that practice between sessions is part of the work. She checks that Meera understands and invites questions.",
ex:"In three sentences, explain CBT to Meera in plain language, without jargon. Then list one thing you would not say because it could sound dismissive of her experience.",
q:{q:"Which statement best describes CBT?",o:["A single fixed protocol applied identically to every condition","A family of structured, collaborative, present-focused therapies that build skills","A way of replacing negative feelings with positive ones","A treatment that never involves the past"],a:1,e:"CBT is an umbrella for related therapies that are structured, collaborative and skills-based (Rector, 2010; Dobson, 2010). It does not ignore the past, and it is not a single protocol."}},
{t:"1.2 Ancient roots and behavioural psychology",
p:["The philosophical ancestor most often cited is Stoicism. Epictetus, in the Enchiridion, taught that people are disturbed less by events than by the judgments they form about them. Beck acknowledged this lineage, and it explains why CBT puts interpretation, not the event itself, at the centre of emotional response (Beck et al., 1979). Note the careful wording: Stoicism is a conceptual forerunner, not a clinical method.",
"The behavioural stream is empirical. Ivan Pavlov’s research on conditioned reflexes in dogs showed that a neutral signal repeatedly paired with a meaningful stimulus can come to produce a response of its own (Pavlov, 1927). John B. Watson and Rosalie Rayner (1920) reported conditioning a fear response in an infant, the study known as “Little Albert”. It shaped the view that fears can be learned, but by present standards it was ethically unacceptable, and it has well-known methodological limits. It should be taught as history, not as a model.",
"B. F. Skinner extended the picture with operant conditioning: behaviour is shaped by its consequences, so actions that are reinforced become more likely (Skinner, 1953). Joseph Wolpe then applied learning principles to anxiety through systematic desensitization, pairing relaxation with graded exposure to feared images (Wolpe, 1958). These ideas underlie today’s behavioural activation and exposure methods (Modules 7 and 8). Their limit, as Rector (2010) notes in describing the field’s history, is that early behaviour therapy worked well for anxiety but had less to offer in depression, where internal meaning seemed central."],
cs:"Teaching example (fictional). Daniel avoids elevators after being stuck in one. Each time he takes the stairs he feels relief. In operant terms the relief reinforces avoidance, so the fear persists and grows. Naming this loop helps him see his avoidance as learned, not as a personal weakness.",
ex:"Describe one everyday behaviour of your own that is maintained by a consequence (reinforcement). Identify the behaviour, the consequence, and whether the consequence helps you in the long run.",
q:{q:"In the elevator case, why does Daniel’s fear persist?",o:["Avoidance is followed by relief, which reinforces avoiding","Elevators are objectively dangerous","He has not been conditioned to fear them","Relief makes him confront the fear"],a:0,e:"Relief after avoiding is negative reinforcement: it strengthens avoidance and prevents learning that the feared outcome may not happen (Skinner, 1953)."}},
{t:"1.3 The cognitive revolution: Beck and Ellis",
p:["In the late 1950s and early 1960s, Aaron T. Beck, a psychiatrist trained in psychoanalysis, set out to test the theory that depression reflects hostility turned inward. What he observed instead was a pattern of negative, biased thinking in his patients, including distorted views of themselves, their circumstances and their futures (Beck, 1963). This became the cognitive triad, and it led to a short-term, structured therapy with the goal of testing and revising such thoughts (Beck, 1976; Beck et al., 1979).",
"Independently, psychologist Albert Ellis developed what became Rational Emotive Behaviour Therapy (REBT). Its “ABC” model holds that emotional consequences (C) follow from beliefs (B) about an activating event (A), not from the event alone (Ellis, 1962). Ellis was more directive and philosophical in style; Beck emphasized collaborative, evidence-based testing of thoughts. Both treat meaning as therapeutically central, but they differ in method, and the difference matters for how clinicians question clients (Module 6).",
"This “cognitive revolution” changed psychotherapy’s question from “what has this person been conditioned to do?” to “what does this person believe, and does the belief fit the evidence?” Beck’s work also placed research at the heart of the approach: his treatment manuals were tested in clinical trials, a habit that continues to define CBT."],
cs:"Teaching example (fictional). Amara, a nurse who recently moved to Canada, receives a short email from her manager and thinks, “I’m going to be fired.” Under Ellis’s ABC model, A is the email, B the belief, and C her panic. A Beckian therapist would also record the thought, rate how strongly she believes it, and test it against evidence.",
ex:"Use the ABC model to analyze a recent moment of stress of your own. Write A, B and C, then write one alternative belief and how C might change.",
q:{q:"Which description best matches Beck’s original observation?",o:["Depressed patients showed hostility directed inward","Depressed patients showed systematic negative biases in thinking about self, world and future","Depression is caused entirely by faulty reinforcement","Depression has no cognitive component"],a:1,e:"Beck (1963; 1976) found negative cognitive biases, later formalized as the cognitive triad, rather than the inward hostility predicted by psychoanalytic theory."}},
{t:"1.4 Integration, evidence and the Canadian context",
p:["Through the 1970s and 1980s, the behavioural and cognitive traditions merged into what we now call CBT. A useful way to hold the two together: behavioural methods show clients what happens when they act differently, and cognitive methods help them understand what the experience means. The contemporary field has since broadened with the “third wave” (mindfulness-, acceptance- and metacognition-based approaches), reviewed in Module 11.",
"On evidence, Hofmann et al. (2012) reviewed 106 meta-analyses and found strong support for CBT in anxiety disorders, somatoform disorders, bulimia, anger control problems and general stress, with more modest or mixed findings elsewhere. Rector (2010) reports hundreds of clinical trials and calls CBT a gold-standard treatment for depression and anxiety. Read that phrasing with care. Bhattacharya et al. (2013) note that how CBT works is not fully understood, and the strength of evidence differs across conditions, populations and outcome measures.",
"In Canada, the CANMAT 2023 guidelines continue to list CBT among first-line psychological treatments for major depressive disorder (Lam et al., 2024). In Ontario, CBT-based care is offered through the Ontario Structured Psychotherapy (OSP) program, which includes coach-guided self-help and individual or group therapy. Practising psychotherapy or social work as a regulated professional requires registration, for example with CRPO or OCSWSSW, and this course does not confer it. For safety concerns follow your organization’s protocol, consult your supervisor, and remember that 9-8-8 is Canada’s call or text suicide crisis line (Public Health Agency of Canada, 2023)."],
cs:"Teaching example (fictional). Priya, 29, is referred by her family doctor for anxiety. Her clinician explains that CBT has strong evidence for anxiety, that individual responses vary, and that progress will be reviewed regularly using agreed measures. She does not promise a cure.",
ex:"Write two sentences you could use to describe the evidence for CBT to a client honestly, without overstating certainty.",
q:{q:"Which statement about the evidence is most accurate?",o:["CBT’s mechanism of action has been definitively proven","CBT is well supported for many conditions, but evidence varies by condition and its mechanism is not fully settled","CBT works equally well for every disorder","Guidelines do not mention CBT"],a:1,e:"Hofmann et al. (2012) show strong support for several conditions, while Bhattacharya et al. (2013) note unresolved questions about mechanism."}}
];

G[1]={o:["Describe the five-part cognitive model and apply it to a real situation","Distinguish thoughts from emotions and from behaviours","Explain how reinforcement and avoidance maintain distress","Apply the here-and-now principle and treat thoughts as testable hypotheses","Describe collaboration as a working method, not just a tone"],
L:[
{t:"2.1 The five-part model",
p:["The cognitive model proposes that a situation does not lead directly to an emotion. Between them sits an interpretation, and the pieces influence one another. A widely used teaching format divides a reaction into five parts: the situation, thoughts, emotions, physical reactions and behaviours (Padesky & Mooney, 1990). Beck (1976) and J. S. Beck (2021) place the automatic thought at the centre. Rector (2010) uses a similar situation–thought–feeling–behaviour description to introduce clients to CBT.",
"The model is useful because each part is a possible entry point. A client who cannot change a situation (a layoff, a delayed immigration decision) can still examine a thought, change a behaviour or reduce physical arousal. A common teaching error is confusing thoughts with feelings. “I feel like a failure” contains the word feel but states a judgment (a thought); the emotion might be sadness or shame. A second error is presenting the model as proof that the client’s thinking is “wrong”. It is a map for curiosity, not a verdict."],
cs:"Teaching example (fictional). Amara, a nurse newly arrived in Canada, receives a short email from her manager. Situation: the email. Thought: “I’m going to be fired.” Emotion: fear (80/100). Body: racing heart, tight chest. Behaviour: she closes her laptop and delays replying for two hours.",
dlg:[["Therapist","You said you panicked after the email. What was going through your mind just before that?"],["Client","That I’m going to be fired."],["Therapist","How strongly did you believe that at the time, from 0 to 100?"],["Client","About 90."],["Therapist","And what did you notice in your body, and what did you do next?"],["Client","My heart was racing. I closed the laptop and didn’t answer for two hours."],["Therapist","Let’s write this out together so we can see how the pieces connect."]],
why:"Clinical reasoning: the first question is open and targets the thought itself, not the event. The belief rating gives a baseline to compare later. Asking about the body and behaviour completes the five parts. “Together” signals collaboration, and the therapist neither challenges nor reassures yet, because the aim at this stage is understanding.",
ex:"Choose a moment of stress from the past week and complete the five parts. Underline any item you wrote as a thought but that is really an emotion.",
q:{q:"“I feel like a failure” is best classified as…",o:["An emotion","A thought (a self-judgment)","A behaviour","A physical reaction"],a:1,e:"The sentence states a judgment about the self. The emotion would be a word such as sad or ashamed."}},
{t:"2.2 Learning theory, reinforcement and avoidance",
p:["Learning theory explains why distress can persist even when the original danger has passed. Mowrer’s (1947) two-factor account proposes that fear is first acquired through association (classical conditioning, Module 1) and then maintained by avoidance, because avoiding brings relief and relief reinforces avoiding. The client never learns that the feared outcome might not have happened. Rector (2010) describes this avoidance cycle and its role in anxiety.",
"Cognitive theory adds that avoidance can be subtle. Salkovskis (1991) described safety behaviours, such as rehearsing sentences, gripping a railing or always sitting near an exit. They feel protective, but they let clients credit “safety” to the behaviour and not to the situation being safe enough. Habituation (anxiety falling with exposure) was the classical explanation for why exposure works. More recent models emphasize learning new, non-threatening associations that compete with old fear associations (Craske et al., 2014). Teach both ideas carefully, since the field is still developing."],
cs:"Teaching example (fictional). Hana, 41, avoids speaking in team meetings. Each time she stays silent she feels relieved, so silence is reinforced. When she must speak, she scripts every sentence and avoids eye contact. Her therapist names both as safety behaviours and explains the loop in plain language.",
ex:"Draw the avoidance cycle for Hana: trigger, prediction, anxiety, avoidance or safety behaviour, relief, and the result for the next trigger. Then name one safety behaviour of your own.",
q:{q:"Why do safety behaviours maintain anxiety?",o:["They raise arousal","They prevent the person from learning that the situation is safe enough without them","They are always harmful","They remove the original trigger"],a:1,e:"Safety behaviours let the person attribute safety to the behaviour, which blocks disconfirmation of the fear (Salkovskis, 1991)."}},
{t:"2.3 Here-and-now focus and empirical evaluation",
p:["CBT concentrates mainly on current difficulties and the processes that maintain them. Developmental history is explored when it clarifies a present pattern, not as an end in itself (Rector, 2010; Beck, 2021). For many clients, especially those who expect therapy to be a long review of childhood, saying this early builds trust and sets expectations.",
"Empirical evaluation means treating a belief as a hypothesis. The therapist asks what predictions follow from it and how they could be tested, through reviewing evidence or running an experiment (Module 7). The common mistake is using “evidence” to win an argument. The question is “what do we find when we look?”, not “here is why you are wrong”. Sometimes the evidence supports the thought. Then the work shifts to problem-solving or acceptance."],
cs:"Teaching example (fictional). Tomás, recently unemployed, believes, “If I ask a question in the interview, they’ll think I’m unprepared.” The therapist helps him turn this into a testable prediction.",
dlg:[["Therapist","What do you predict will happen if you ask a question at the interview?"],["Client","They’ll decide I’m unprepared. I’d say 80% sure."],["Therapist","If that were true, what would we expect to see or hear from the interviewers?"],["Client","They’d look annoyed, or say the question was already answered."],["Therapist","How could we find out? Perhaps ask a mock panel, or notice how the real panel responds."]],
why:"Clinical reasoning: the therapist asks for a prediction and a belief rating, which turns a vague worry into something measurable. The question about what would be observed sets a clear criterion. Proposing options, not instructions, protects collaboration.",
ex:"Take one belief you hold about a work situation. Write the prediction, a belief rating, what would count as evidence, and one way to test it.",
q:{q:"What best describes empirical evaluation of a thought?",o:["Proving the client’s thought is wrong","Treating the thought as a hypothesis and examining evidence or testing it","Ignoring the thought","Replacing it with a positive statement"],a:1,e:"The aim is accuracy through examination, not winning an argument or positive thinking (Beck, 2021)."}},
{t:"2.4 Collaboration as a therapeutic principle",
p:["Collaboration in CBT is a method. Therapist and client set the agenda together, agree on goals, review what was useful and adjust the plan. Guided discovery, in which the therapist asks questions that help the client reach their own conclusions, is preferred to lecturing (Beck, 2021). Clients are more likely to adopt insights they have reached themselves.",
"Collaboration also requires cultural humility. A client may expect a directive expert, may be reluctant to disagree with a professional, or may view discussing family matters as inappropriate. A therapist can ask about expectations, explain the working style and invite feedback regularly. Professional codes in Ontario emphasize informed consent, competence and anti-oppressive practice (CRPO, n.d.; OCSWSSW, 2023). Collaboration does not remove the therapist’s responsibility for safety, which sometimes means taking a more active stance."],
cs:"Teaching example (fictional). Mei, a recent newcomer, nods agreeably but does not complete homework. Her therapist asks, “How is this way of working fitting with what you expected from therapy?” Mei says she was taught not to question professionals. They agree on smaller tasks, and she is invited to say “this does not fit” at any time.",
ex:"Write three questions you could ask a new client at the start of therapy to learn their expectations and preferences for how you work together.",
q:{q:"A client agrees to everything but does not complete homework. The best next step is to…",o:["Assign more homework","Explore expectations and barriers collaboratively and adjust the task","Discharge the client","Stop assigning homework permanently"],a:1,e:"Silent non-adherence is information. Collaborative exploration, including cultural expectations, guides adjustment (Beck, 2021)."}}],
x:'<div class="card"><h3>Worksheet 1: Cognitive model</h3><p><b>Instructions.</b> Choose one recent situation. Fill each box in order, then read across the boxes to see how they connect. Rate emotions from 0 to 100.</p><div class="tw"><table><tr><th>Situation</th><th>Thought (belief 0–100)</th><th>Emotion (0–100)</th><th>Body</th><th>Behaviour</th></tr><tr><td>Email from manager</td><td>I’m going to be fired (90)</td><td>Fear (80)</td><td>Racing heart, tight chest</td><td>Closed laptop, delayed reply</td></tr><tr><td style="height:90px"></td><td></td><td></td><td></td><td></td></tr></table></div><p class="src">Completed example above; the blank row is for your own entry. Use the print function of your browser for a paper copy.</p></div>',
s:["The five-part model links situation, thoughts, emotions, body and behaviour.","Avoidance and safety behaviours maintain distress through reinforcement.","Thoughts are treated as hypotheses and tested.","Collaboration is a method and requires cultural humility."],

G[2]={o:["Define automatic thoughts and explain how they differ from reflective thinking","Identify and name the major cognitive distortions in client statements","Use thought monitoring and the cognitive triad in assessment and teaching","Recognize common therapist errors when eliciting thoughts"],
L:[
{t:"3.1 Identifying automatic thoughts",
p:["Automatic thoughts are the quick evaluations that arise in a situation without deliberate reasoning. They are often brief, are accepted as plain fact, and may be verbal (“I’ll mess this up”) or visual, such as a mental image of being laughed at (Beck, 1976; Beck, 2021). Clients usually notice the emotion first and the thought only when asked. That is why a sudden shift in mood during a session is a useful cue: “What was going through your mind just then?”",
"Teaching clients to catch automatic thoughts is the first practical CBT skill, and Rector (2010) treats it as the foundation for later work. The usual sequence is: notice the mood change, ask what thought or image came first, record it, and rate belief in it (0–100). Common errors are accepting an emotion word as the thought (“I felt anxious”), asking “why” questions that invite analysis, and moving to challenge the thought before the client feels understood."],
cs:"Teaching example (fictional). Leila, 36, goes quiet in a session when her therapist asks about contacting her landlord. The therapist notices the shift and asks about it.",
dlg:[["Therapist","I noticed you went quiet just now. What was going through your mind?"],["Client","Nothing really. I just felt tense."],["Therapist","Tense. Was there a thought or a picture in your mind when that began?"],["Client","I pictured him shouting at me. And I thought, I’ll make it worse."],["Therapist","Thank you. How strongly do you believe, I’ll make it worse, right now, from 0 to 100?"],["Client","About 75."]],
why:"Clinical reasoning: the therapist links a visible mood change to a cognitive event, then offers “a picture” as an option because some clients report images, not words. The belief rating records a baseline, and thanking the client reinforces disclosure. No challenge is offered yet.",
ex:"For the next three days, notice two mood shifts. Write the situation, the thought or image that came first, and your belief rating.",
q:{q:"Which response best elicits an automatic thought?",o:["Why do you feel that way?","What was going through your mind just then?","You shouldn’t think like that.","Let’s talk about your childhood."],a:1,e:"An open question about thoughts or images at the moment of the mood shift targets the automatic thought; “why” invites analysis."}},
{t:"3.2 The major cognitive distortions",
p:["Cognitive distortions are habitual patterns of biased interpretation. Beck (1963; 1976) described systematic errors in depressed patients’ reasoning, and the commonly taught list was popularized by Burns (1980) and is used in many workbooks (Greenberger & Padesky, 2016); Rector (2010) presents a similar list. Several lists exist and the labels overlap, so treat them as teaching tools, not diagnostic categories. A single thought often contains more than one distortion.",
"Naming a distortion helps only when the client finds it useful. Labelling a client’s thought as “catastrophizing” in a corrective tone can feel dismissive. Introduce the idea as a pattern most people show, ask whether it fits, and check whether the thought might also be accurate. Some thoughts that sound distorted reflect real discrimination, hardship or danger, and these deserve problem-solving and validation, not relabelling. This point is especially important for newcomers, racialized clients and people facing real precarity."],
cs:"Teaching example (fictional). Raj, 45, tells his therapist, “My résumé was rejected, so I’ll never work in Canada again, and everyone must think my training is worthless.” The therapist notes three possible distortions and also asks about the real barriers he faces, such as credential recognition.",
ex:"Write three of your own thoughts from a stressful week. Name a possible distortion for each, and note whether any of them might also have been partly accurate.",
q:{q:"“I made one mistake in the report, so I’m a complete failure.” This best illustrates…",o:["Mind reading","All-or-nothing thinking and labelling","Emotional reasoning only","Fortune telling only"],a:1,e:"A single error is turned into a global self-label (Burns, 1980; Beck, 2021)."}},
{t:"3.3 Thought monitoring and the cognitive triad",
p:["Thought monitoring means recording situations, thoughts, emotions and behaviours between sessions, so patterns can be seen in daily life and not recalled imprecisely later (Greenberger & Padesky, 2016). Start simple: situation, emotion, thought. Add belief ratings once the client can identify thoughts reliably. Review the record collaboratively and ask what stood out to them.",
"In depression, Beck described a cognitive triad: negative views of the self, the world (or one’s experience) and the future (Beck et al., 1979). Examples are “I’m worthless,” “Nothing here welcomes me” and “It will never get better.” Listening for the triad can help a therapist understand a client’s presentation, but it should not become a script. Hopelessness about the future needs careful attention to risk. If a client reports thoughts of suicide, follow your organization’s protocol, consult your supervisor, and share 9-8-8 (Public Health Agency of Canada, 2023)."],
cs:"Teaching example (fictional). Chen, 52, has been low since a layoff. His log shows the same three themes: “I’m a burden,” “Nobody will hire me,” and “Things won’t improve.” His therapist reflects the pattern, asks how it fits, and checks his safety directly.",
dlg:[["Therapist","Looking at your log, I see three themes: how you see yourself, how you see your situation, and how you see the future. Do those fit?"],["Client","Yes. They feel true."],["Therapist","They feel true, and that makes sense given how hard this period is. Have you had thoughts of ending your life?"],["Client","Sometimes, but I wouldn’t act on it."],["Therapist","Thank you for telling me. Let’s talk about that more before we continue with the log."]],
why:"Clinical reasoning: the therapist uses the triad to organize the client’s themes and invites him to confirm or correct them. Because hopeless themes raise concern about risk, the therapist asks directly, which does not increase risk, and then puts safety before technique.",
ex:"Create a one-week thought log with three columns (situation, emotion, thought). Describe how you would explain the purpose of it to a client in two sentences.",
q:{q:"What is the best response when a client’s log shows strong hopelessness?",o:["Continue the log and ignore it","Ask directly about suicidal thoughts and follow your organization’s protocol and supervision","Tell the client to think positively","Skip to exposure"],a:1,e:"Hopelessness requires risk assessment and safety planning before routine technique, with 9-8-8 and 911 as resources."}},
{t:"3.4 Common therapist errors",
p:["Several errors recur when teaching clients to work with thoughts. Therapists may challenge too early, before the client feels understood; argue with the content of a thought, which usually strengthens it; or treat every unhelpful thought as a distortion without asking whether it might be true. Others overload the client with technical terms or assign thought records that are too complicated to complete (Beck, 2021).",
"Supervision is the best safeguard. Recording sessions with consent, reviewing a thought record together, and asking clients for feedback each session all reveal where the process is going wrong. Bhattacharya et al. (2013) note the importance of therapist training in CBT, and the standards of professional colleges in Ontario also stress practising within one’s competence (CRPO, n.d.; OCSWSSW, 2023)."],
cs:"Teaching example (fictional). A trainee tells a client, “That is just mind reading.” The client withdraws. In supervision, the trainee practises instead asking, “How do you know what your coworkers are thinking? What might we see that would tell us?”",
ex:"Rewrite this therapist statement so it is collaborative and curious: “You’re catastrophizing again.”",
q:{q:"Which approach to a client’s distorted thought is most collaborative?",o:["Telling them it is a distortion and moving on","Exploring how the thought arose and examining what supports or does not support it together","Ignoring the thought","Agreeing with it to build rapport"],a:1,e:"Guided, curious exploration builds learning and alliance; correction or agreement does not."}}],
x:'<div class="card"><h3>Table: common cognitive distortions</h3><p class="src">Labels vary between sources (Burns, 1980; Greenberger &amp; Padesky, 2016; Rector, 2010); examples are fictional.</p><div class="tw"><table><tr><th>Distortion</th><th>Description</th><th>Example</th></tr><tr><td>All-or-nothing thinking</td><td>Seeing things in two categories only</td><td>“If it’s not perfect, it’s a failure.”</td></tr><tr><td>Overgeneralization</td><td>One event treated as a never-ending pattern</td><td>“I never do anything right.”</td></tr><tr><td>Mental filter</td><td>Dwelling on one negative detail</td><td>Focusing on one critical comment among many good ones</td></tr><tr><td>Disqualifying the positive</td><td>Dismissing good experiences</td><td>“They only said that to be nice.”</td></tr><tr><td>Mind reading</td><td>Assuming others’ negative thoughts without evidence</td><td>“They think I’m boring.”</td></tr><tr><td>Fortune telling</td><td>Predicting a bad outcome as fact</td><td>“I’ll fail the interview.”</td></tr><tr><td>Catastrophizing / magnification</td><td>Expecting the worst; inflating importance</td><td>“If I stumble, my career is over.”</td></tr><tr><td>Emotional reasoning</td><td>Treating feelings as proof</td><td>“I feel scared, so it must be dangerous.”</td></tr><tr><td>Should statements</td><td>Rigid rules about oneself or others</td><td>“I should never need help.”</td></tr><tr><td>Labelling</td><td>Attaching a global label</td><td>“I’m a loser.”</td></tr><tr><td>Personalization</td><td>Taking responsibility for things beyond one’s control</td><td>“It’s my fault the team missed the target.”</td></tr></table></div></div><div class="card"><h3>Worksheet 2: Five-column thought record</h3><p><b>Instructions.</b> After a mood shift, fill the columns in order and re-rate your feeling at the end. This five-column format is a starting version; Module 6 adds evidence columns.</p><div class="tw"><table><tr><th>Situation</th><th>Automatic thought (belief 0–100)</th><th>Emotion (0–100)</th><th>Balanced thought (belief 0–100)</th><th>Re-rated emotion</th></tr><tr><td>Manager’s short email</td><td>I’m going to be fired (90)</td><td>Fear (80)</td><td>She is brief with everyone; I can ask tomorrow (60)</td><td>Fear (40)</td></tr><tr><td style="height:90px"></td><td></td><td></td><td></td><td></td></tr></table></div></div><div class="card"><h3>Worksheet 3: Cognitive distortions identification</h3><p><b>Instructions.</b> Write a stressful thought, name any distortions that might apply, then write one question that checks the thought.</p><div class="tw"><table><tr><th>Thought</th><th>Possible distortion(s)</th><th>Question to check it</th></tr><tr><td>Everyone at the meeting thought my idea was stupid.</td><td>Mind reading; overgeneralization</td><td>What did people actually say or do?</td></tr><tr><td style="height:90px"></td><td></td><td></td></tr></table></div></div>',
s:["Automatic thoughts are fast, plausible and often unnoticed.","Distortions are common patterns, not defects; some thoughts may also be accurate.","Thought logs and the cognitive triad guide assessment and risk attention.","Curious exploration beats correction."],
r:["rector","beck63","beck76","beck79","bj21","bur","gp","crpo","oc","h988","bhat"]};

G[3]={o:["Describe the cognitive hierarchy from automatic thoughts to core beliefs","Distinguish rules, attitudes and assumptions from core beliefs","Explain how core beliefs develop and are activated, including cultural and migration contexts","Use appropriate methods to identify core beliefs and begin modifying unhelpful ones"],
L:[
{t:"4.1 The cognitive hierarchy",
p:["CBT describes thinking at three connected levels. At the surface are automatic thoughts, which are specific to a situation. Beneath them are intermediate beliefs: rules, attitudes and assumptions that guide behaviour. At the deepest level are core beliefs, broad and rigid ideas about the self, other people and the world (Beck, 2021). Beck’s cognitive model of depression used the term schema for the underlying structures that organize how information is selected and interpreted (Beck, 1976; Beck et al., 1979). Rector (2010) describes a similar progression from automatic thoughts to underlying rules and beliefs.",
"The hierarchy matters because treating only surface thoughts can leave the source unchanged. If a client replaces “I’ll fail this interview” with a balanced thought but still holds the belief “I am inadequate,” similar automatic thoughts will return in the next challenging situation. Even so, not every client needs deep belief work. Many people improve substantially with behavioural and automatic-thought methods, and brief CBT may not reach core beliefs at all. Choose the level of intervention that fits the client’s goals, time and readiness."],
cs:"Teaching example (fictional). Sofia, 38, is a newly arrived engineer. Situation: a colleague does not reply to her message. Automatic thought: “She’s ignoring me because I’m not good enough.” The therapist notes this thought recurs across Sofia’s records and begins to wonder about the beliefs beneath it.",
ex:"Take one automatic thought from your own log. Write the possible rule or assumption beneath it, and a possible core belief. Mark how confident you are that each fits.",
q:{q:"Which is the best example of an intermediate belief (an assumption)?",o:["“I’ll fail this exam.”","“If I make a mistake, people will reject me.”","“I am unlovable.”","“My heart is racing.”"],a:1,e:"An if–then rule is an intermediate belief. The first item is an automatic thought and the third a core belief (Beck, 2021)."}},
{t:"4.2 Intermediate beliefs: rules, attitudes and assumptions",
p:["Intermediate beliefs are the working rules a person lives by. They often take three forms: rules (“I must always be prepared”), attitudes (“It’s terrible to need help”) and assumptions, usually written as if–then statements (“If I speak up, I’ll be criticized”). They often function as compensatory strategies, helping a person cope with a painful core belief, for example working excessively hard to avoid feeling inadequate (Beck, 2021).",
"Many such rules are adaptive in context. A rule such as “I must not burden my family” may reflect a valued commitment in many cultures and may protect important relationships. The therapeutic question is not whether a rule is “wrong” but whether it is flexible, whether it costs the client more than it gives, and whether the client wishes to change it (Hays & Iwamasa, 2006). Imposing the therapist’s own cultural assumptions about autonomy or assertiveness is a common error."],
cs:"Teaching example (fictional). Arjun, 31, sends money to his family and works two jobs. His rule: “I must never ask for help, or I’m weak.” His therapist explores what the rule has protected him from, what it costs him now, and which parts of it he wants to keep.",
ex:"Write one if–then assumption you hold. Note what it helps with, what it costs, and a more flexible version that still respects your values.",
q:{q:"A client’s rule reflects a cultural value of family duty. The most appropriate response is to…",o:["Label it as a distortion and challenge it","Explore what it protects, what it costs and what the client wants to change","Tell the client to reduce family obligations","Avoid the topic"],a:1,e:"Collaborative exploration respects cultural values and keeps change in the client’s hands (Hays & Iwamasa, 2006)."}},
{t:"4.3 Core beliefs: development and activation",
p:["Core beliefs usually form early through interactions with caregivers, peers, school, community and wider society, including experiences of safety, criticism, loss or discrimination. J. S. Beck (2021) groups many negative core beliefs under helplessness, unlovability and worthlessness. They are typically held as absolute truths and often stay dormant until a relevant critical incident, such as job loss, migration or a relationship ending, activates them. Young’s schema therapy, a related approach that emphasizes early maladaptive schemas, is a distinct model with its own training (Young et al., 2003).",
"Core beliefs also develop in social context. A newcomer repeatedly treated as an outsider, or a person who experienced racism, may develop beliefs such as “I don’t belong” that reflect real experience as well as interpretation. A therapist should acknowledge this reality and avoid treating the belief only as an individual cognitive error. The work may include validating the experience, building supportive connections and examining where the belief is too global (“I never belong anywhere”)."],
cs:"Teaching example (fictional). Naledi, 27, moved to Toronto for graduate study. After being mistaken for a cleaner at her own department event, she begins to think, “I don’t belong here.” Her therapist validates the event and its context, then asks where she has felt she belongs.",
dlg:[["Therapist","That event sounds painful. When that happened, what did it make you think about yourself?"],["Client","That I don’t belong here. That I never will."],["Therapist","Thank you for telling me. Was there anything about what happened that suggests the problem was with how others treated you?"],["Client","Maybe. But it’s hard not to take it as a sign about me."],["Therapist","That makes sense. Let’s look at both parts: what is true about how you were treated, and what the belief says about you."]],
why:"Clinical reasoning: the therapist begins with validation and asks about the meaning of the event for the self. The question separating others’ behaviour from the client’s worth avoids both blaming the client and dismissing a real experience. The final statement offers a two-part structure, not a correction.",
ex:"Think of a critical incident in your own life or a fictional client’s. Describe what belief it might activate and what part of the belief reflects real circumstances.",
q:{q:"A client experiences racism and concludes, “I don’t belong.” Which approach is best?",o:["Treat it only as an individual thinking error","Validate the experience, then examine where the belief becomes too global","Ignore the belief","Tell the client to avoid similar settings"],a:1,e:"Beliefs can reflect real experience; validate it while examining overgeneralization (Beck, 2021; Hays & Iwamasa, 2006)."}},
{t:"4.4 Identifying and modifying unhelpful beliefs",
p:["Core beliefs can be identified in several ways: noticing themes across thought records, using the downward-arrow technique (repeatedly asking what a thought would mean, detailed in Module 6), reviewing assumptions that a client states, and using questionnaires such as the Dysfunctional Attitude Scale or the Young Schema Questionnaire where trained and appropriate. Choose a method that fits the client, and offer the belief as a hypothesis: “I wonder whether a belief like this might sit underneath. Does that fit?” (Beck, 2021).",
"Modification takes longer than changing automatic thoughts, and it usually combines cognitive and behavioural methods. Common methods include a continuum (rating where one falls from 0 to 100 on a trait, instead of a yes/no label), a positive data log recording evidence that fits a new, more balanced belief, and behavioural experiments (Module 7) (Padesky, 1994; Beck, 2021). The aim is not to install a positive belief such as “I am wonderful,” but a believable, balanced alternative such as “I am a capable person who sometimes makes mistakes.” Work at this level is best done with supervision, particularly for clients with trauma histories."],
cs:"Teaching example (fictional). Sofia (from 4.1) shares recurring themes: “I’m not good enough.” With her therapist she creates a continuum for “competence” and keeps a weekly log of small successes at work. After six weeks she rates her belief in “I’m not good enough” from 85 to 55.",
ex:"Choose a belief of yours that seems all-or-nothing. Draw a 0–100 continuum, place yourself and two people you know on it, and write what you notice.",
q:{q:"What is a better target for belief modification?",o:["“I am wonderful in every way.”","A believable, balanced alternative such as “I am capable and sometimes make mistakes.”","Removing all negative thoughts","Agreeing with the client’s belief"],a:1,e:"Balanced, believable beliefs are more durable than exaggerated positive ones (Beck, 2021)."}}],
x:'<div class="card"><h3>Table: levels of cognition</h3><div class="tw"><table><tr><th>Level</th><th>Description</th><th>Example</th></tr><tr><td>Automatic thought</td><td>Situation-specific, quick</td><td>“She’s ignoring me.”</td></tr><tr><td>Intermediate belief</td><td>Rules, attitudes, assumptions</td><td>“If I’m not perfect, people reject me.”</td></tr><tr><td>Core belief</td><td>Global, rigid view of self, others or world</td><td>“I’m not good enough.”</td></tr></table></div></div><div class="card"><h3>Worksheet 4: Core belief identification</h3><p><b>Instructions.</b> List three recent automatic thoughts, look for what they share, and write a possible rule and core belief. Rate your belief in the core belief (0–100). Treat the result as a hypothesis to examine with your supervisor or therapist.</p><div class="tw"><table><tr><th>Automatic thoughts</th><th>Theme</th><th>Possible rule or assumption</th><th>Possible core belief (0–100)</th></tr><tr><td>“She’s ignoring me.” “I’ll fail the review.” “They’ll see I’m a fraud.”</td><td>Not being good enough</td><td>If I’m not flawless, I’ll be rejected</td><td>I’m not good enough (80)</td></tr><tr><td style="height:90px"></td><td></td><td></td><td></td></tr></table></div></div>',
s:["Cognition operates at three levels: automatic thoughts, intermediate beliefs and core beliefs.","Rules and beliefs develop in cultural and social context and may reflect real experience.","Beliefs are identified collaboratively and held as hypotheses.","Modification aims at balanced, believable alternatives and usually combines cognitive and behavioural methods."],
r:["rector","beck76","beck79","bj21","hays","young","pad94","bhat"]};

R.young="Young, J. E., Klosko, J. S., & Weishaar, M. E. (2003). Schema therapy: A practitioner’s guide. Guilford Press.";
R.pad94="Padesky, C. A. (1994). Schema change processes in cognitive therapy. Clinical Psychology & Psychotherapy, 1(5), 267–278.";

G[4]={o:["Conduct a structured, collaborative CBT assessment interview","Identify triggers, maintaining factors and functions of behaviour","Assess strengths and risk, and respond within professional standards","Develop a shared formulation, treatment plan and SMART goals","Read and critique a complete worked case formulation"],
L:[
{t:"5.1 Initial assessment and clinical interviewing",
p:["A CBT assessment has two purposes: to understand the person’s difficulties well enough to plan treatment, and to begin the working relationship. Typical content includes the presenting problems in the client’s own words, onset and course, current functioning, relevant history, medical and substance-use factors, previous treatment, supports, culture, language and migration history, and the client’s goals (Beck, 2021; Rector, 2010). Brief standardized measures, such as the PHQ-9 for depression and the GAD-7 for anxiety, give a baseline for tracking change (Kroenke et al., 2001; Spitzer et al., 2006). They support clinical judgment and do not replace it.",
"Interview skills matter as much as content. Start with open questions, then clarify with specific examples (“Tell me about the last time this happened”), summarize often and check understanding. Explain why you ask sensitive questions and give the client choice about pacing, especially with trauma histories. When working through an interpreter, brief the interpreter first and discuss confidentiality in the consent process. Diagnosis, where it is within your scope of practice and registration, informs treatment choice but does not replace a formulation. Not every regulated professional in Ontario may diagnose, so clarify your scope with your college and supervisor (CRPO, n.d.; OCSWSSW, 2023)."],
cs:"Teaching example (fictional). Elena, 33, arrived in Canada eight months ago as a skilled worker. She reports poor sleep, low motivation and constant worry about money and her credentials. The therapist begins with Elena’s own description of the problem, asks for a recent example, and completes the PHQ-9 and GAD-7 together with her.",
ex:"Write five open questions you would use to explore a presenting problem and one question to explore the client’s culture and migration experience.",
q:{q:"What is the main role of standardized measures such as the PHQ-9 in CBT?",o:["They replace clinical judgment","They provide a baseline and track change alongside clinical judgment","They produce a diagnosis on their own","They are required before the first session"],a:1,e:"Measures support, not replace, clinical judgment, and allow progress tracking (Kroenke et al., 2001; Spitzer et al., 2006)."}},
{t:"5.2 Triggers, maintaining factors and functional assessment",
p:["Formulation attends to what started a difficulty (precipitants), what made the person vulnerable (predisposing factors), and above all what keeps it going now (maintaining factors). In CBT, maintaining factors are often cycles: for example, worry leads to poor sleep, which lowers concentration, which produces mistakes, which fuel further worry. The treatment targets these cycles (Persons, 2008; Kuyken et al., 2009).",
"A functional assessment examines what a behaviour does for the person. Ask about the antecedent (what came before), the behaviour, and the consequence, short-term and long-term. Avoidance, reassurance seeking and substance use may bring short-term relief while keeping the problem alive. Understanding the function avoids judgment and shows what the client will need instead. Include contextual and structural factors too: unstable housing, income insecurity, discrimination or immigration processes may be real maintaining factors that call for practical and advocacy responses, not only cognitive techniques."],
cs:"Teaching example (fictional). Elena checks job postings for hours at night. Antecedent: worry about money. Behaviour: late-night searching. Short-term consequence: a sense of doing something. Long-term consequence: poor sleep, fatigue, lower performance in interviews. The therapist maps this as a cycle with Elena on paper.",
ex:"Choose a recurring problem and map antecedent, behaviour, short-term consequence and long-term consequence. Identify one structural factor that CBT alone cannot change.",
q:{q:"Why is a functional assessment of avoidance useful?",o:["It labels the client as avoidant","It reveals what the behaviour achieves, so treatment can offer a workable alternative","It proves the client is not trying","It replaces the need for goals"],a:1,e:"Function explains why a behaviour persists and what a replacement must provide (Persons, 2008)."}},
{t:"5.3 Strengths, risk and safety",
p:["A formulation that lists only problems gives a distorted picture. Record strengths and resources early: skills, values, supports, past coping, cultural and spiritual resources and reasons for seeking help. These guide treatment and are protective. Strength-based and anti-oppressive frameworks fit naturally with CBT formulation.",
"Risk assessment is part of every assessment. Ask directly about suicidal thoughts, self-harm, harm to others, abuse and neglect, and substance use. Asking does not plant the idea. Follow your organization’s risk protocol, document your assessment, consult your supervisor, and know the limits of confidentiality and any duty to report. A collaborative safety plan, such as the Safety Planning Intervention, lists warning signs, coping steps, contacts and means safety (Stanley & Brown, 2012). In Canada, people can call or text 9-8-8 for suicide crisis support, and 911 is for immediate danger (Public Health Agency of Canada, 2023)."],
cs:"Teaching example (fictional). Elena rates her mood 3/10, says she “sometimes wishes she could disappear,” and denies a plan. The therapist asks more directly about suicidal thoughts, explores protective factors (her sister, her faith, her work goals), and agrees a plan for what to do if thoughts intensify.",
dlg:[["Therapist","You mentioned wishing you could disappear. Have you had thoughts of ending your life?"],["Client","Sometimes, at night. But I wouldn’t do it. My sister depends on me."],["Therapist","Thank you for telling me. Do you have a plan, or access to anything you might use?"],["Client","No plan. Nothing."],["Therapist","I’m glad you told me. Let’s write down what helps and who you’d contact if the thoughts get stronger."]],
why:"Clinical reasoning: the therapist asks about suicide in direct, plain language and follows with questions about plan and means. Naming the client’s reason for living, her sister, is a protective factor to include in the safety plan. This is a teaching example, and real risk assessment follows your organization’s protocol and supervision.",
ex:"List your organization’s steps for a client who discloses suicidal thoughts. Identify one gap and how you would raise it with your supervisor.",
q:{q:"What is the best way to ask about suicide?",o:["Avoid the topic to prevent planting ideas","Ask directly and plainly, then assess plan, intent and means, and follow protocol","Hint indirectly","Ask only at the final session"],a:1,e:"Direct questions are recommended and do not increase risk; follow protocol and supervision (Stanley & Brown, 2012)."}},
{t:"5.4 Collaborative formulation, treatment planning and SMART goals",
p:["A formulation is a working hypothesis that links the problems, their development and their maintenance, and it is shared with the client for correction and refinement (Kuyken et al., 2009). Sharing it is itself therapeutic: many clients feel relieved when scattered difficulties form an understandable pattern. A useful test is whether the client says, “Yes, that fits.” Hold it lightly and revise as you learn more.",
"Treatment planning follows from the formulation. Agree on priorities, the likely number and frequency of sessions, the main methods, and how progress will be measured. Goals work best when they are SMART: specific, measurable, achievable, relevant and time-bound (Doran, 1981). “Feel better” becomes “take a 15-minute walk on three days this week and rate mood before and after.” Goals should come from the client’s priorities, not only the therapist’s, and may include practical goals such as housing or work, which a social worker may address through referral and advocacy."],
cs:"Teaching example (fictional). Elena and her therapist agree on three goals: sleep, job search routine and worry. They write a SMART goal for the first.",
dlg:[["Therapist","What would you most like to be different in a month?"],["Client","I want to sleep and not feel so panicked."],["Therapist","Let’s make that more specific. What would you notice if sleep were better?"],["Client","Asleep by midnight, at least five nights a week."],["Therapist","How could we measure that, and what might get in the way?"],["Client","I could keep a sleep log. Searching for jobs at night might get in the way."],["Therapist","Let’s look at that together: when could job searching happen so it fits your goal?"]],
why:"Clinical reasoning: the therapist begins with the client’s words, then asks what she would notice, which makes the goal observable. Asking about measurement and obstacles builds in problem-solving, and the final question links the goal back to the formulation, where night-time searching was a maintaining factor.",
ex:"Rewrite the goal “reduce my anxiety” as a SMART goal, then list one obstacle and one way to address it.",
q:{q:"Which is the best SMART goal?",o:["Be less anxious","Practise a 10-minute breathing exercise each evening for two weeks and rate anxiety before and after","Fix my whole life","Stop all worry"],a:1,e:"It is specific, measurable, achievable, relevant and time-bound (Doran, 1981)."}},
{t:"5.5 A fully worked fictional formulation",
p:["Elena, 33, arrived in Canada eight months ago on a skilled-worker pathway. Presenting problems: low mood, poor sleep, constant worry about money and credentials, withdrawal from friends. Precipitants: migration, job loss of a previous income level, delay in professional recognition. Predisposing factors: a childhood in which achievement earned approval, and a family emphasis on self-sufficiency. Protective factors: close relationship with her sister, spiritual practice, strong work ethic, English fluency, and willingness to attend therapy.",
"Cognitive and behavioural processes: Elena’s automatic thoughts include “I’m falling behind” and “I’ve made a terrible mistake coming here.” Her rule is, “If I’m not working, I have no worth.” Her core belief is, “I’m not good enough.” Her night-time job searching, avoidance of social events and poor sleep keep the cycle going: fatigue lowers performance, which strengthens the belief. Structural factors, such as credential recognition and financial strain, are real and are addressed through referrals and advocacy as well as therapy.",
"Plan: weekly sessions for about 12 sessions, reviewed at session 6 using the PHQ-9 and GAD-7. Priorities: (1) sleep routine and limiting night-time searching, (2) behavioural activation, including contact with friends, (3) thought records for the “falling behind” thoughts, (4) later, exploring the “not good enough” belief. Referrals: settlement and credential-recognition services. Risk: passive thoughts with protective factors; safety plan agreed; review each session. This formulation is a teaching example and is shared with Elena for correction."],
cs:"Teaching example (fictional). Elena reads the formulation and says the part about “no worth if not working” is the most accurate. She asks to add her sister’s role as a support, and the therapist updates the formulation with her.",
ex:"Using Worksheet 6, write a formulation for a fictional client of your choice. Include at least two protective factors and one structural factor.",
q:{q:"Which element of Elena’s formulation is a maintaining factor?",o:["A childhood where achievement earned approval","Night-time job searching that disrupts her sleep and performance","Her relationship with her sister","Her English fluency"],a:1,e:"Maintaining factors are current patterns that keep the problem going; the others are predisposing or protective."}}],
x:'<div class="card"><h3>Worksheet 6: CBT case formulation template</h3><p><b>Instructions.</b> Complete one row per section with the client, in their words where possible. Share it, ask what fits and what does not, and revise.</p><div class="tw"><table><tr><th>Section</th><th>Example (Elena, fictional)</th><th>Your entry</th></tr><tr><td>Presenting problems</td><td>Low mood, poor sleep, worry about money and credentials</td><td style="height:50px"></td></tr><tr><td>Precipitants</td><td>Migration; job loss; delayed recognition</td><td></td></tr><tr><td>Predisposing factors</td><td>Approval tied to achievement; self-sufficiency</td><td></td></tr><tr><td>Automatic thoughts</td><td>I’m falling behind</td><td></td></tr><tr><td>Rules and core belief</td><td>If I’m not working I have no worth; I’m not good enough</td><td></td></tr><tr><td>Maintaining cycle</td><td>Night searching, poor sleep, lower performance, stronger belief</td><td></td></tr><tr><td>Strengths and protective factors</td><td>Sister, faith, work ethic</td><td></td></tr><tr><td>Risk and safety</td><td>Passive thoughts; safety plan agreed</td><td></td></tr><tr><td>Treatment plan</td><td>Sleep, activation, thought records, later belief work</td><td></td></tr></table></div></div><div class="card"><h3>Worksheet 7: SMART treatment goal planner</h3><p><b>Instructions.</b> Start from what the client wants, then make each goal specific, measurable, achievable, relevant and time-bound.</p><div class="tw"><table><tr><th>Broad goal</th><th>Specific action</th><th>Measure</th><th>Timeframe</th><th>Obstacle and plan</th></tr><tr><td>Sleep better</td><td>In bed by 11:30 and no job searching after 9 pm</td><td>Sleep log: 5 nights a week</td><td>Two weeks</td><td>Late searching urge: schedule search time at 4 pm</td></tr><tr><td style="height:90px"></td><td></td><td></td><td></td><td></td></tr></table></div></div>',
s:["Assessment gathers history, current functioning, culture, strengths and risk, and builds the relationship.","Formulation links precipitants, predisposing and protective factors, and maintaining cycles.","Risk is asked about directly and handled by protocol and supervision.","Goals are collaborative and SMART."],
